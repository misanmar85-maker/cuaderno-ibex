      ` : t==='letra_venta' ? `
        <label>Letras que vendes<select id="fLote">${opcionesLotesLetras(m.valor)||'<option value="">No tienes Letras vivas</option>'}</select></label>
        <label>Número de letras<input class="numin" id="fTit" inputmode="decimal" placeholder="5" value="${v(m.titulos)}"></label>
        <label>Precio de venta (% del nominal)<input class="numin" id="fPrecio" inputmode="decimal" placeholder="99,250" value="${v(m.precio)}"></label>
        <label>Comisiones y gastos (€)<input class="numin" id="fGastos" inputmode="decimal" placeholder="0,00" value="${v(m.gastos)}"></label>
        <p class="hint">Solo si vendes antes del vencimiento en el mercado secundario. Al vencer, la app las da por cobradas sola: no hace falta apuntar nada.</p>
      ` : t==='liberadas' ? `
        <label>Acciones recibidas<input class="numin" id="fTit" inputmode="decimal" placeholder="12" value="${v(m.titulos)}"></label>
        <p class="hint">Acciones gratuitas de un <b>dividendo flexible (scrip)</b> o ampliación liberada. No tributan al recibirlas: el coste de tus acciones se reparte entre las antiguas y las nuevas, que heredan su antigüedad (art. 37.1.a LIRPF). Si en vez de acciones vendiste los derechos a la propia empresa a precio fijo, regístralo como <b>Dividendo</b>; si los vendiste en bolsa, como <b>Venta de derechos</b>.</p>
      ` : t==='derechos' ? `
        <label>Importe bruto de la venta (€)<input class="numin" id="fBruto" inputmode="decimal" placeholder="25,00" value="${v(m.bruto)}"></label>
        <label>Comisiones y gastos (€)<input class="numin" id="fGastos" inputmode="decimal" placeholder="0,00" value="${v(m.gastos)}"></label>
        <label>Retención (€)<input class="numin" id="fRet" inputmode="decimal" placeholder="19 % si lo dejas vacío" value="${v(m.retencion)}"></label>
        <p class="hint">Venta de <b>derechos de suscripción o de asignación gratuita en bolsa</b>: desde 2017 tributa entera como ganancia patrimonial del año en que vendes, con retención del 19 %. Si los vendiste a la propia empresa a precio fijo (opción habitual del scrip), regístralo como <b>Dividendo</b>.</p>
      ` : t==='split' ? `
        <label>Acciones nuevas<input class="numin" id="fNue" inputmode="decimal" placeholder="2" value="${v(m.nuevas)}"></label>
        <label>Por cada (antiguas)<input class="numin" id="fAnt" inputmode="decimal" placeholder="1" value="${v(m.antiguas)}"></label>
        <p class="hint"><b>Split</b> (por ejemplo 2 nuevas por cada 1) o <b>contrasplit</b> (1 nueva por cada 10). Cambia el número de acciones y su coste unitario, pero no tu coste total ni la antigüedad. No tributa.</p>
      ` : t==='dividendo' ? `
        <label>Importe bruto (€)<input class="numin" id="fBruto" inputmode="decimal" placeholder="115,00" value="${v(m.bruto)}"></label>
        <label>Retención (€)<input class="numin" id="fRet" inputmode="decimal" placeholder="19 % si lo dejas vacío" value="${v(m.retencion)}"></label>
      ` : `
        <label>Títulos<input class="numin" id="fTit" inputmode="decimal" placeholder="100" value="${v(m.titulos)}"></label>
        <label>Precio por acción (€)<input class="numin" id="fPrecio" inputmode="decimal" placeholder="6,85" value="${v(m.precio)}"></label>
        <label>Comisiones y gastos (€)<input class="numin" id="fGastos" inputmode="decimal" placeholder="0,00" value="${v(m.gastos)}"></label>
      `}
      ${store.carteras.length>1?`<label>Cartera<select id="fCart">${store.carteras.map(c=>`<option value="${esc(c.id)}" ${c.id===cartDefault(editando)?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></label>`:''}
      ${LETRAS.includes(t)&&!editando&&!cartLetras()?`<label class="rad" style="grid-column:1/-1"><input type="checkbox" id="fCartLT" checked> Guardarla en una cartera aparte «Letras del Tesoro» (mismo titular: la renta se calcula junto con tus acciones)</label>`:''}
      <label>ISIN (opcional)<input id="fIsin" autocomplete="off" placeholder="ES0113900J37" value="${esc(m.isin||'')}"></label>
      <label>Nota o motivo (opcional)<input id="fNota" autocomplete="off" placeholder="Por qué compras o vendes, bróker…" value="${esc(m.nota||'')}"></label>
      <div class="preview" id="fPrev"></div>
      <div class="err-msg" id="fErr" hidden></div>
      <div class="actions" style="grid-column:1/-1">
        <button class="btn" type="submit">${editando?'Guardar cambios':'Añadir '+TIPO_TXT[t].toLowerCase()}</button>
        ${editando?'<button class="btn ghost" type="button" id="fCancel">Cancelar</button>':''}
      </div>
    </form>
  </div>

  <div class="toolbar">
    <h2>Historial <span class="muted" style="font-weight:400;font-size:.9rem">(${lista.length}${hayFiltro?' de '+state.movs.length:''})</span></h2>
  </div>
  <div class="mv-filtros">
    <input id="flQ" type="search" placeholder="Buscar valor, empresa o nota" value="${esc(filtroTxt)}" autocomplete="off" aria-label="Buscar movimientos">
    <label>Tipo<select id="flT"><option value="">Todos</option>${[['compra','Compras'],['venta','Ventas'],['dividendo','Dividendos'],['letras','Letras'],['otras','Otras']].map(([k,l])=>`<option value="${k}" ${k===filtroTipo?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Valor<select id="flV"><option value="">Todos</option>${valoresUsados.map(x=>`<option ${x===filtroValor?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
    <label>Año<select id="flA"><option value="">Todos</option>${anios.map(x=>`<option ${x===filtroAnio?'selected':''}>${x}</option>`).join('')}</select></label>
    ${hayFiltro?'<button class="btn ghost small" type="button" id="flX">Quitar filtros</button>':''}
  </div>
  ${lista.length&&(sumF.c||sumF.v||sumF.d)?`<p class="mv-sum">${[sumF.c?'Compras '+eur(sumF.c):'',sumF.v?'Ventas '+eur(sumF.v):'',sumF.d?'Dividendos brutos '+eur(sumF.d):''].filter(Boolean).join(' · ')}</p>`:''}
  ${borrarId?`<div class="confirm"><span>¿Eliminar este movimiento? No se puede deshacer.</span><button class="btn danger small" id="cSi">Eliminar</button><button class="btn ghost small" id="cNo">Cancelar</button></div>`:''}
  <div class="cards mob">${lista.length? lista.map(x=>{
      const vt=ventaMap.get(x.id);
      const {imp,det,res}=infoMov(x,vt);
      return `<div class="card"${borrarId===x.id?' style="background:var(--loss-soft)"':''}>
        <div><b>${esc(x.valor)}</b>${nombre(x.valor)?` <span class="muted" style="font-size:.82rem">${esc(nombre(x.valor))}</span>`:''} <span class="chip ${x.tipo}">${TIPO_CORTO[x.tipo]||x.tipo}</span>${demo?' <span class="chip demo">ej.</span>':''}<div class="meta">${fmtD(x.fecha)}</div></div>
        <div class="r"><div class="${cls(imp)}">${sgn(imp)}</div>${res?`<div style="font-size:.85rem">${res}</div>`:''}</div>
        <div class="full meta">${det}${x.nota?' · '+esc(x.nota):''}</div>
        <div class="full actions" style="justify-content:flex-end"><button class="btn ghost small" data-ed="${esc(x.id)}">Editar</button><button class="btn ghost small" data-del="${esc(x.id)}">Eliminar</button></div>
      </div>`;}).join('') : `<div class="panel empty">No hay movimientos con estos filtros.</div>`}</div>
  <div class="tbl desk"><table>
    <thead><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th class="n">Títulos</th><th class="n">Precio</th><th class="n">Gastos</th><th class="n">Importe</th><th class="n">Resultado</th><th></th></tr></thead>
    <tbody>${lista.length? lista.map(x=>{
      const vt=ventaMap.get(x.id);
      const {imp,res}=infoMov(x,vt);
      const sinTP=['dividendo','derechos','split'].includes(x.tipo);
      return `<tr${borrarId===x.id?' style="background:var(--loss-soft)"':''}>
        <td class="n">${fmtD(x.fecha)}</td><td><span class="chip ${x.tipo}">${TIPO_CORTO[x.tipo]||x.tipo}</span>${demo?' <span class="chip demo">ej.</span>':''}</td>
        <td><b>${esc(x.valor)}</b>${nombre(x.valor)?`<div class="muted" style="font-size:.78rem">${esc(nombre(x.valor))}</div>`:''}${x.nota?`<div class="muted" style="font-size:.78rem;white-space:normal;max-width:220px">${esc(x.nota)}</div>`:''}</td>
        <td class="n">${x.tipo==='split'?NUM.format(x.nuevas)+':'+NUM.format(x.antiguas):sinTP?'':NUM.format(x.titulos)}</td>
        <td class="n">${sinTP||x.tipo==='liberadas'?'':EUR4.format(x.precio)}</td>
        <td class="n">${x.tipo==='dividendo'?eur(x.retencion||0)+' ret.':x.tipo==='derechos'?eur(x.gastos||0)+' · '+eur(x.retencion||0)+' ret.':eur(x.gastos||0)}</td>
        <td class="n ${cls(imp)}">${sgn(imp)}</td><td class="n">${res}</td>
        <td><div class="actions" style="flex-wrap:nowrap"><button class="btn ghost small" data-ed="${esc(x.id)}">Editar</button><button class="btn ghost small" data-del="${esc(x.id)}">Eliminar</button></div></td></tr>`;}).join('') : `<tr><td colspan="9" class="empty">No hay movimientos con estos filtros.</td></tr>`}
    </tbody></table></div>
  </div>`;

  el.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{tipoForm=b.dataset.tipo==='otras'?(ESPECIALES.includes(tipoForm)?tipoForm:'liberadas'):b.dataset.tipo==='letras'?(LETRAS.includes(tipoForm)?tipoForm:'letra'):b.dataset.tipo;render();});
  const fe=$('fEsp'); if(fe) fe.onchange=()=>{tipoForm=fe.value;render();};
  const fl=$('fLetOp'); if(fl) fl.onchange=()=>{tipoForm=fl.value;render();};
  const fpz=$('fPlazo'), fvc=$('fVenc'), ffe=$('fFecha');
  if(fpz&&fvc){ const auto=()=>{ if(fpz.value&&ffe.value) fvc.value=sumarSemanas(ffe.value,{3:13,6:26,9:39,12:52}[fpz.value]); fvc.dispatchEvent(new Event('input',{bubbles:true})); };
    fpz.onchange=auto; ffe.addEventListener('change',()=>{ if(fpz.value) auto(); }); if(!fvc.value&&fpz.value) auto(); }
  $('flV').onchange=e=>{filtroValor=e.target.value;render();};
  $('flA').onchange=e=>{filtroAnio=e.target.value;render();};
  $('flT').onchange=e=>{filtroTipo=e.target.value;render();};
  const fq=$('flQ'); fq.oninput=()=>{filtroTxt=fq.value;const pos=fq.selectionStart;render();const n=$('flQ');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  const fx=$('flX'); if(fx) fx.onclick=()=>{filtroValor='';filtroAnio='';filtroTipo='';filtroTxt='';render();};
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editId=b.dataset.ed;borrarId=null;render();window.scrollTo({top:0,behavior:'smooth'});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{borrarId=b.dataset.del;render();});
  if(borrarId){$('cSi').onclick=()=>{
      if(demo){empezarSilencioso();}
      else {store.movs=store.movs.filter(x=>x.id!==borrarId);guardar();}
      borrarId=null;render();toast('Movimiento eliminado');};
    $('cNo').onclick=()=>{borrarId=null;render();};}
  if(editando) $('fCancel').onclick=()=>{editId=null;render();};

  const prev=()=>{
    const p=$('fPrev'); if(!p) return;
    if(t==='letra'){const n=toNum($('fTit').value),pr=toNum($('fPrecio').value),g=toNum($('fGastos').value)||0,ve=$('fVenc').value,fe=$('fFecha').value;
      if(n>0&&pr>0){const c=n*NOMINAL_LETRA*pr/100+g, nom=n*NOMINAL_LETRA; const d=ve&&fe?days(fe,ve):0; p.textContent=`Pagas ${eur(c)} · cobrarás ${eur(nom)}${ve?' el '+fmtD(ve):''} · rendimiento ${sgn(nom-c)}${d>0?' · TAE '+PCT.format(Math.pow(nom/c,365/d)-1)+' ('+d+' días)':''}`;} else p.textContent=''; return;}
    if(t==='letra_venta'){const n=toNum($('fTit').value),pr=toNum($('fPrecio').value),g=toNum($('fGastos').value)||0; p.textContent=n>0&&pr>0?`Cobras ${eur(n*NOMINAL_LETRA*pr/100-g)} por la venta`:''; return;}
    if(t==='liberadas'||t==='split'){p.textContent='';return;}
    if(t==='derechos'){const b=toNum($('fBruto').value),g=toNum($('fGastos').value)||0;let r=toNum($('fRet').value);if(isNaN(r)&&isFinite(b))r=r2(b*.19);p.textContent=isFinite(b)?`Ganancia patrimonial: ${eur(b-g)} · neto en cuenta: ${eur(b-g-(isFinite(r)?r:0))}`:'';return;}
    if(t==='dividendo'){const b=toNum($('fBruto').value);let r=toNum($('fRet').value);if(isNaN(r)&&isFinite(b))r=r2(b*.19);p.textContent=isFinite(b)?`Neto cobrado: ${eur(b-(isFinite(r)?r:0))} · retención ${eur(isFinite(r)?r:0)}`:'';}
    else{const q=toNum($('fTit').value),pr=toNum($('fPrecio').value),g=toNum($('fGastos').value)||0;if(isFinite(q)&&isFinite(pr))p.textContent=t==='compra'?`Coste total: ${eur(q*pr+g)} · coste por acción con gastos: ${EUR4.format((q*pr+g)/q)} €`:`Importe neto de la venta: ${eur(q*pr-g)}`;else p.textContent='';}
  };
  $('fMov').addEventListener('input',prev); prev();
  $('fMov').onsubmit=e=>{
    e.preventDefault();
    const err=$('fErr'); err.hidden=true;
    const fecha=$('fFecha').value, valor=LETRAS.includes(t)?'':$('fValor').value.trim().toUpperCase();
    const fail=t=>{err.textContent=t;err.hidden=false;};
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return fail('Indica la fecha del movimiento.');
    if(!valor && !LETRAS.includes(t)) return fail('Indica el valor, por ejemplo SAN o ITX.');
    const o={tipo:t,fecha,valor,isin:$('fIsin').value.trim().toUpperCase(),nota:$('fNota').value.trim(),cartera:($('fCart')&&carteraDe($('fCart').value))?$('fCart').value:cartDefault(editando)};
    o.nuevas=0;o.antiguas=0;o.ratio=0;
    if(t==='letra'){
      o.venc=$('fVenc').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(o.venc)) return fail('Indica la fecha de vencimiento (elige el plazo o escríbela).');
      if(o.venc<=fecha) return fail('El vencimiento debe ser posterior a la fecha de compra.');
      o.titulos=toNum($('fTit').value); o.precio=toNum($('fPrecio').value); o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos)) o.gastos=0;
      if(!(o.titulos>0)||Math.round(o.titulos)!==o.titulos) return fail('Indica el número de letras (número entero).');
      if(!(o.precio>50&&o.precio<=101)) return fail('El precio va en % del nominal, por ejemplo 98,123.');
      o.nominal=NOMINAL_LETRA; o.valor='LT-'+o.venc; o.bruto=0; o.retencion=0;
    } else if(t==='letra_venta'){
      o.valor=($('fLote')||{}).value||''; if(!o.valor) return fail('No tienes Letras vivas que vender.');
      o.venc=o.valor.slice(3); o.titulos=toNum($('fTit').value); o.precio=toNum($('fPrecio').value); o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos)) o.gastos=0;
      if(!(o.titulos>0)||Math.round(o.titulos)!==o.titulos) return fail('Indica el número de letras (número entero).');
      if(!(o.precio>50&&o.precio<=101)) return fail('El precio va en % del nominal, por ejemplo 99,250.');
      if(fecha>=o.venc) return fail('Esa fecha ya es la del vencimiento o posterior: no hace falta registrar la venta, la app las da por cobradas.');
      o.nominal=NOMINAL_LETRA; o.bruto=0; o.retencion=0;
    } else if(t==='liberadas'){
      o.titulos=toNum($('fTit').value); if(!(o.titulos>0)) return fail('Indica cuántas acciones gratuitas recibiste.');
      o.precio=0;o.gastos=0;o.bruto=0;o.retencion=0;
    } else if(t==='split'){
      o.nuevas=toNum($('fNue').value); o.antiguas=toNum($('fAnt').value);
      if(!(o.nuevas>0)||!(o.antiguas>0)) return fail('Indica la proporción: acciones nuevas por cada antiguas.');
      o.ratio=o.nuevas/o.antiguas; o.titulos=0;o.precio=0;o.gastos=0;o.bruto=0;o.retencion=0;
    } else if(t==='derechos'){
      o.bruto=toNum($('fBruto').value); if(!(o.bruto>0)) return fail('Indica el importe bruto de la venta de derechos.');
      o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos)) o.gastos=0;
      const r=toNum($('fRet').value); o.retencion=isNaN(r)?r2(o.bruto*.19):r;
      if(o.retencion<0||o.retencion>o.bruto) return fail('La retención debe estar entre 0 y el importe bruto.');
      o.titulos=0;o.precio=0;
    } else if(t==='dividendo'){
      o.bruto=toNum($('fBruto').value); if(!(o.bruto>0)) return fail('Indica el importe bruto del dividendo (antes de retención).');
      const r=toNum($('fRet').value); o.retencion = isNaN(r)? r2(o.bruto*.19) : r;
      if(o.retencion<0||o.retencion>o.bruto) return fail('La retención debe estar entre 0 y el importe bruto.');
      o.titulos=0;o.precio=0;o.gastos=0;
    } else {
      o.titulos=toNum($('fTit').value); o.precio=toNum($('fPrecio').value); o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos))o.gastos=0;
      if(!(o.titulos>0)) return fail('Indica cuántos títulos.');
      if(!(o.precio>0)) return fail('Indica el precio por acción.');
      if(o.gastos<0) return fail('Las comisiones no pueden ser negativas.');
      o.bruto=0;o.retencion=0;
    }
    if(demo) empezarSilencioso();
    if(LETRAS.includes(t)&&!editando&&$('fCartLT')&&$('fCartLT').checked&&!cartLetras()){ const id='c'+uid(); store.carteras.push({id,nombre:'Letras del Tesoro',fiscal:'conjunto'}); o.cartera=id; store.activa=id; }
    if(editando && !demo){Object.assign(state.movs.find(x=>x.id===editId),o);editId=null;toast('Cambios guardados');}
    else {const seq=Math.max(0,...store.movs.map(x=>x.seq||0))+1; store.movs.push(Object.assign({id:uid(),seq},o)); toast(TIPO_TXT[t]+' añadida');}
    editId=null; prefill=null;
    guardar(); render();
  };
}
function empezarSilencioso(){store=nuevoStore();sincronizar();demo=false;}

function varHoy(v){const x=state.precios[v];if(!x||x.v==null||!isFinite(x.v))return '';const c=x.v/100;return `<div class="meta ${cls(c)}">hoy ${pct(c)}</div>`;}
function renderCartera(R,hoy){
  const el=$('v-cartera');
  const P=R.posiciones;
  const tot={coste:P.reduce((s,p)=>s+p.coste,0),merc:P.reduce((s,p)=>s+(isFinite(p.mercado)?p.mercado:0),0),lat:P.reduce((s,p)=>s+(isFinite(p.latente)?p.latente:0),0),div:P.reduce((s,p)=>s+p.divVal,0)};
  el.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
  ${segCartera()}
  ${carSeg==='todo'?repartoCartera(R):''}
  ${carSeg==='letras'?panelLetrasCartera(R):''}
  <div class="car-acc" ${carSeg==='letras'?'hidden':''}>
  <div class="toolbar"><h2>Posiciones abiertas</h2>
    ${ajustes.csvUrl?`<div class="actions"><span class="muted" style="font-size:.82rem">${ajustes.ultimaAct?'Precios de las '+new Date(ajustes.ultimaAct).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · retraso aprox. 15 min':'Sin actualizar todavía'}</span><button class="btn small" id="bAct" ${cargandoPrecios||demo?'disabled':''}>${cargandoPrecios?'Actualizando…':'Actualizar precios'}</button></div>`:`<button class="btn ghost small" id="bConf">Conectar precios automáticos</button>`}</div>
  ${errPrecios?`<p class="err-msg">${esc(errPrecios)}</p>`:''}

function wireCalendario(){
  const a=$('calAdd'); if(!a) return;
  a.onclick=()=>{calForm=!calForm;render();};
  document.querySelectorAll('[data-calx]').forEach(b=>b.onclick=()=>{const id=b.dataset.calx;
    if((store.cal||[]).some(d=>d.id===id)) store.cal=store.cal.filter(d=>d.id!==id); else {store.calOcultos=[...(store.calOcultos||[]),id];}
    if(!demo) guardar(); render(); toast('Aviso quitado');});
  const ok=$('cOk'); if(ok) ok.onclick=()=>{const err=$('cErr'); const t=$('cT').value.trim().toUpperCase(); const ex=$('cEx').value, pa=$('cPa').value, im=toNum($('cIm').value);
    if(!t){err.textContent='Indica el valor.';err.hidden=false;return;}
    if(!ex&&!pa){err.textContent='Indica al menos la fecha ex-dividendo o la de pago.';err.hidden=false;return;}
    store.cal=[...(store.cal||[]),{id:'u'+uid(),t,ex,pago:pa,imp:im>0?im:0,estado:'confirmado',fuente:'Añadido por ti'}];
    calForm=false; if(!demo) guardar(); render(); toast('Dividendo añadido al calendario');};
}

function construirExcel(X,R,hoy){ const _oc=oculto; oculto=false; try{ return construirExcel0(X,R,hoy); } finally { oculto=_oc; } }
function construirExcel0(X,R,hoy){

        ws[X.utils.encode_cell({r,c:+c})]={t:'n',v:Math.round(v*100)/100,f:`SUM(${col}2:${col}${nR+1})`,z:fmt[c]||FE};}
    }
    if(pie&&pie.length){pie.forEach((t,i)=>{ws[X.utils.encode_cell({r:ultima+2+i,c:0})]={t:'s',v:t};});ultima=ultima+1+pie.length;}
    ws['!ref']=X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(ultima,0),c:cab.length-1}});
    ws['!cols']=(anchos||cab.map(()=>14)).map(w=>({wch:w}));
    if(nR) ws['!autofilter']={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:nR,c:cab.length-1}})};
    X.utils.book_append_sheet(wb,ws,nomHoja(nombre));
  }

  /* 1. Resumen fiscal por año */
  const anios=Object.keys(R.anios).sort();

    anios.map(y=>{const a=R.anios[y];return [Number(y),r2(a.gan),r2(a.per),r2(a.noComp),r2(a.saldoGP),r2(a.divBruto),r2(a.divRet),r2(a.arrUsado||0),r2(a.base),r2(a.cuota),r2(a.resultado),r2(a.arrastreSiguiente||0),r2(a.letRend||0)];}),
    {1:FE,2:FE,3:FE,4:FE,5:FE,6:FE,7:FE,8:FE,9:FE,10:FE,11:FE,12:FE},[8,14,16,18,14,14,13,18,16,14,18,20,18],null,

    {1:FD,5:FN,6:FE,7:FE,8:FE,9:FE,10:FE,11:FE},[7,12,8,28,14,9,16,16,15,15,18,15,10,40],{6:1,7:1,8:1,9:1,10:1,11:1},

    R.posiciones.map(p=>[p.valor,nombre(p.valor)||p.valor,p.qty,r2(p.pm),r2(p.coste),isFinite(p.precio)?p.precio:'',p.fechaPrecio?fecha(p.fechaPrecio):'',isFinite(p.mercado)?r2(p.mercado):'',isFinite(p.latente)?r2(p.latente):'',isFinite(p.latente)&&p.coste?p.latente/p.coste:'',Math.round(p.diasMedio)]),
    {2:FN,3:FE,4:FE,5:FE,6:FD,7:FE,8:FE,9:FP},[8,28,9,14,14,14,12,16,18,10,14],{4:1,7:1,8:1},
    ['La plusvalía latente no tributa hasta que vendes.',AVISO]);

    const imp=m.tipo==='compra'?-(m.titulos*m.precio+(m.gastos||0)):m.tipo==='venta'?m.titulos*m.precio-(m.gastos||0):m.tipo==='derechos'?(m.bruto||0)-(m.gastos||0)-(m.retencion||0):(m.tipo==='liberadas'||m.tipo==='split')?0:(m.bruto||0)-(m.retencion||0);

  const cabMov=['Fecha','Tipo','Valor','Entidad emisora','Títulos','Precio (€)','Gastos (€)','Dividendo bruto (€)','Retención (€)','Importe en cuenta (€)','Títulos tras la operación','Ganancia / pérdida venta (€)','No computable 2 meses (€)','Nota','Cartera'];

    const blob=new Blob([buf],{type:tipo});

    msg.textContent='Excel descargado: '+fn; toast('Excel descargado');

  <div class="panel">
    <h2>Precios automáticos</h2>
    <p class="note">La app lee los precios de una hoja de Google tuya que usa la función GOOGLEFINANCE. Las cotizaciones de la Bolsa de Madrid llegan con unos 15 minutos de retraso. La guía de instalación explica cómo crear la hoja.</p>
    <label>Enlace CSV publicado de tu hoja<input id="aUrl" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" value="${esc(ajustes.csvUrl)}"></label>
    <div class="actions"><button class="btn" id="aGuardar">Guardar y probar</button>${ajustes.csvUrl?'<button class="btn ghost" id="aQuitar">Desconectar</button>':''}</div>
    ${errPrecios?`<p class="err-msg">${esc(errPrecios)}</p>`:(ajustes.ultimaAct?`<p class="note">Última actualización: ${new Date(ajustes.ultimaAct).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}</p>`:'')}
  </div>
  ${panelBloqueo()}
  <div class="grid2">
    <div class="panel">
      <h2>Copia de seguridad</h2>
      <p class="note">Tus datos solo están en este dispositivo. Guarda una copia en iCloud, Google Drive o tu correo de vez en cuando. Última copia: <b>${ult}</b>.</p>
      <div class="actions">
        ${puedeCompartir?`<button class="btn" id="eShare" ${demo||!store.movs.length?'disabled':''}>Compartir copia…</button>`:''}
        <button class="btn ${puedeCompartir?'ghost':''}" id="eJson" ${demo||!store.movs.length?'disabled':''}>Descargar copia (JSON)</button>
        <button class="btn ghost" id="eCsv" ${demo||!store.movs.length?'disabled':''}>Descargar para Excel (CSV)</button>
      </div>
      <p class="note" id="eMsg"></p>
    </div>
    <div class="panel">
      <h2>Restaurar</h2>
      <p class="note">Carga una copia (.json o .txt) hecha con esta app o con la versión de Claude. Sustituirá todos los movimientos y precios actuales.</p>
      <label>Archivo de copia (.json o .txt)<input type="file" id="iFile" accept=".json,.txt,application/json,text/plain"></label>
      <div id="iConf"></div>
    </div>
  </div>
  <p class="note">Cartera de Inversiones <b>v${APP_VERSION}</b> · versión móvil. Funciona sin conexión; solo necesita internet para actualizar precios.</p>
  </div>`;
  const nombre=ext=>'cartera-inversiones-'+todayStr()+'.'+ext;
  const json=()=>JSON.stringify(Object.assign({app:'cartera-inversiones',exportado:new Date().toISOString()},store),null,1);
  const marcar=()=>{ajustes.ultimaCopia=new Date().toISOString();guardarAjustes();};
  const descargar=(fn,data,type)=>{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);};
  wireBloqueo();
  $('eJson').onclick=()=>{descargar(nombre('json'),json(),'application/json');marcar();toast('Copia descargada');render();};
  $('eCsv').onclick=()=>{descargar(nombre('csv'),toCSV(),'text/csv;charset=utf-8');toast('CSV descargado');};
  /* Se comparte como .txt (texto plano): es el tipo que aceptan todos los móviles y apps. El contenido es el mismo JSON. */
  const es=$('eShare'); if(es) es.onclick=async()=>{
    const datos=json(), fn='copia-'+nombre('txt');
    try{ await navigator.share({files:[new File([datos],fn,{type:'text/plain'})]}); marcar(); render(); toast('Copia compartida'); }
    catch(e){
      if(e&&e.name==='AbortError') return;
      const det=(e&&e.name?e.name:'Error')+(e&&e.message?': '+e.message:'');
      try{ descargar(nombre('json'),datos,'application/json'); marcar(); render(); }catch(x){}
      const m=$('eMsg'); if(m) m.textContent='No se pudo compartir ('+det+'). He descargado la copia en su lugar: búscala en Descargas o en Archivos.';
    }
  };
  $('aGuardar').onclick=()=>{const u=$('aUrl').value.trim();
    if(!/^https:\/\/docs\.google\.com\/spreadsheets\/.+/.test(u)){errPrecios='El enlace debe empezar por https://docs.google.com/spreadsheets/ y ser el de "Publicar en la web" en formato CSV.';render();return;}
    ajustes.csvUrl=u;guardarAjustes();
    if(demo){toast('Enlace guardado. Pulsa "Empezar con mi cartera" para usarlo.');render();return;}
    actualizarPrecios(false);};
  const aq=$('aQuitar'); if(aq) aq.onclick=()=>{ajustes.csvUrl='';ajustes.ultimaAct='';errPrecios='';guardarAjustes();render();toast('Precios automáticos desconectados');};
  $('iFile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d; try{d=JSON.parse(rd.result);}catch(x){$('iConf').innerHTML='<p class="err-msg">El archivo no es un JSON válido.</p>';return;}
      if(!d||!Array.isArray(d.movs)){$('iConf').innerHTML='<p class="err-msg">El archivo no parece una copia de esta app.</p>';return;}
      const ok=d.movs.filter(m=>m&&/^\d{4}-\d{2}-\d{2}$/.test(m.fecha)&&['compra','venta','dividendo','liberadas','derechos','split','letra','letra_venta'].includes(m.tipo)&&m.valor);
      $('iConf').innerHTML=`<div class="confirm"><span>${ok.length} movimientos válidos${Array.isArray(d.carteras)&&d.carteras.length>1?' en '+d.carteras.length+' carteras':''}. ¿Sustituir los datos actuales?</span><button class="btn danger small" id="iSi">Sustituir</button><button class="btn ghost small" id="iNo">Cancelar</button></div>`;
      $('iSi').onclick=()=>{store=normalizar(d);demo=false;guardar();tab='resumen';render();toast('Copia restaurada');if(ajustes.csvUrl)actualizarPrecios(true);};
      $('iNo').onclick=()=>{$('iConf').innerHTML='';e.target.value='';};
    };
    rd.readAsText(f);
  };
}

function pintarOjo(){ document.body.classList.toggle('oculto',oculto); const b=$('btnOjo'); if(!b) return; b.setAttribute('aria-pressed',String(oculto));
  b.innerHTML=(oculto?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.3 6.4A13 13 0 0 0 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>Mostrar':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Ocultar');
  b.title=oculto?'Mostrar importes':'Ocultar importes y cantidades'; }
$('btnLock').onclick=()=>bloquearAhora();
$('btnOjo').onclick=()=>{ oculto=!oculto; try{localStorage.setItem('jasz-cartera-oculto',oculto?'1':'0');}catch(e){} pintarOjo(); render(); toast(oculto?'Importes ocultos':'Importes visibles'); };
pintarOjo();
$('fab').onclick=()=>{tab='movimientos';editId=null;prefill=null;borrarId=null;render();window.scrollTo({top:0,behavior:'smooth'});const f=$('fValor');if(f)f.focus();};
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;editId=null;borrarId=null;prefill=null;render();});

/* Exponer el motor para pruebas */
window.__cuaderno={serieEvolucion,calcular,ejemplo,xirr,cuotaAhorro,addMonths,get store(){return store;},get state(){return state;}};
iniciar();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
</body>
