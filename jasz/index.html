<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartera de Inversiones</title>
<meta name="theme-color" content="#1d5c7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inversiones">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: libro de registro de bolsa — cabecera compacta, pestañas, tablas densas con cifras tabulares */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d5dbdf;
  --fg:#16232b; --muted:#5b6a73; --accent:#1d5c7a; --accent-soft:#dbe8ef;
  --gain:#17774a; --gain-soft:#dcefe4; --loss:#b3261e; --loss-soft:#f7e0dd;
  --warn:#8a5a00; --warn-soft:#f6ead0;
  --f-display:"Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#172229; --sunk:#0c1317; --line:#2a3842;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#7fb8d6; --accent-soft:#1d3442;
  --gain:#5cc58d; --gain-soft:#163627; --loss:#f08a80; --loss-soft:#3b1d1a;
  --warn:#e3b660; --warn-soft:#382b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#172229; --sunk:#0c1317; --line:#2a3842;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#7fb8d6; --accent-soft:#1d3442;
  --gain:#5cc58d; --gain-soft:#163627; --loss:#f08a80; --loss-soft:#3b1d1a;
  --warn:#e3b660; --warn-soft:#382b12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--gain)} .dot.busy{background:var(--warn)} .dot.err{background:var(--loss)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.banner.demo{background:var(--warn-soft);border-color:transparent}
.banner p{margin:0;min-width:0;flex:1 1 320px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:500;line-height:1.2}
.kpi .s{font-size:.8rem;color:var(--muted);font-family:var(--f-num)}

dl.rows{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0}
dl.rows dt{color:var(--muted)} dl.rows dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
dl.rows .total{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--fg)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.chip{display:inline-block;font:600 .7rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.chip.compra{background:var(--accent-soft);color:var(--accent)}
.chip.venta{background:var(--sunk);color:var(--fg)}
.chip.dividendo{background:var(--gain-soft);color:var(--gain)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--loss-soft);color:var(--loss)}
.chip.demo{background:var(--warn-soft);color:var(--warn)}

form.mov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
input,select{font:400 .95rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 9px;width:100%;min-width:0}
input.numin{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;width:max-content;max-width:100%}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 .88rem var(--f-body);padding:8px 14px;border-radius:4px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--loss);border-color:var(--loss)}
.btn.small{padding:4px 9px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preview{grid-column:1/-1;font-size:.85rem;color:var(--muted);font-family:var(--f-num)}
.err-msg{grid-column:1/-1;color:var(--loss);font-size:.85rem}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{padding:10px 12px;border-radius:5px;background:var(--warn-soft);color:var(--fg);font-size:.88rem}
.alerts li.info{background:var(--sunk)}
.alerts li b{color:var(--warn)}
.note{font-size:.82rem;color:var(--muted);max-width:75ch;margin:0}
.note-list{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:85ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.toolbar .actions label{min-width:140px}
.priceIn{width:96px;padding:5px 7px;font-size:.85rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:5px;font-size:.88rem;max-width:calc(100% - 32px);z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--loss-soft);border-radius:5px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:58px 1fr 110px;gap:10px;align-items:center;font-size:.85rem}
.bar .track{height:12px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .fill.alt{background:var(--muted)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hero .big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:2.3rem;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.hero .sub{font-family:var(--f-num);font-size:.95rem}
nav.tabs svg{width:20px;height:20px;display:none}
.mob{display:none}
.cards{flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.card .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.card .full{grid-column:1/-1}
.card .meta{font-size:.8rem;color:var(--muted);font-family:var(--f-num)}
.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);font-size:1.9rem;line-height:1;cursor:pointer;z-index:16;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;justify-content:center}
.gl-sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gl-sum div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gl-sum .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.1rem}
.gl-sum .k{font-size:.75rem;color:var(--muted)}
.dbars{display:flex;flex-direction:column;gap:10px}
.dbar{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:4px 10px;align-items:center;font-size:.85rem}
.dbar .track{display:grid;grid-template-columns:1fr 1fr;height:14px}
.dbar .half{display:flex;background:var(--sunk);overflow:hidden}
.dbar .half.l{justify-content:flex-end;border-right:2px solid var(--fg);border-radius:2px 0 0 2px}
.dbar .half.r{border-radius:0 2px 2px 0}
.dbar .fill{height:100%}
.dbar .fill.g{background:var(--gain)} .dbar .fill.p{background:var(--loss)}
.dbar .val{text-align:right}
.dbar .det{grid-column:2/-1;font-size:.75rem;color:var(--muted);font-family:var(--f-num);margin-top:-2px}
.dbar-axis{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:10px;font-size:.72rem;color:var(--muted)}
.dbar-axis div{display:flex;justify-content:space-between}
.cv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.chip.gan{background:var(--gain-soft);color:var(--gain)} .chip.per{background:var(--loss-soft);color:var(--loss)}
.cv-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.cv-sum div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cv-sum .k{font-size:.75rem;color:var(--muted)}
.cv-sum .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.05rem}
.cv-sum .s{font-family:var(--f-num);font-size:.8rem}
.cv-list{display:flex;flex-direction:column;gap:14px}
.cv-row{display:grid;grid-template-columns:52px minmax(0,1fr) 112px;gap:4px 10px;align-items:center;font-size:.85rem}
.cv-bars{display:flex;flex-direction:column;gap:3px}
.cv-bars .t{height:9px;background:var(--sunk);border-radius:2px;overflow:hidden}
.cv-bars .f{height:100%}
.cv-bars .f.coste{background:var(--muted)} .cv-bars .f.g{background:var(--gain)} .cv-bars .f.p{background:var(--loss)}
.cv-row .val{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.3}
.cv-row .det{grid-column:2/-1;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.cv-leg{display:flex;gap:14px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.cv-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mk-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.mk-breadth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mk-breadth div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mk-breadth .k{font-size:.75rem;color:var(--muted)} .mk-breadth .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.1rem}
.mk-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.mk-bar span{display:block;height:100%}
.mk-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mk-tools input{max-width:260px}
.mk-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mk-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mk-row:last-child{border-bottom:0}
.mk-row.mine{background:var(--accent-soft)}
.mk-row .nm{min-width:0}
.mk-row .nm .full{font-weight:600}
.mk-row .nm small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-row .px{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.25}
.mk-row .px .d{font-size:.82rem}
.chip.mine{background:var(--accent);color:var(--surface)}
.cart-bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.cart-bar .cb-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.cart-bar select{width:auto;flex:1 1 200px;max-width:420px}
.cb-seg{overflow-x:auto;flex-wrap:nowrap;max-width:100%;-webkit-overflow-scrolling:touch}
.cb-seg button{white-space:nowrap}
.cb-seg small{font-weight:500;opacity:.8}
.cart-bar .cb-n{font-size:.75rem;color:var(--muted);flex:1 1 100%}
.cart-bar .cb-n{flex:1 1 auto}
.cart-list{display:flex;flex-direction:column;gap:8px}
.cart-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto auto;gap:8px;align-items:center}
.cart-item .cnt{font-size:.8rem;white-space:nowrap}
.cart-new{display:flex;flex-direction:column;gap:10px;max-width:560px}
.nc-q{border:1px solid var(--line);border-radius:5px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:8px}
.nc-q legend{font-size:.82rem;color:var(--fg);font-weight:600;padding:0 4px}
label.rad{flex-direction:row;align-items:center;gap:8px;font-size:.88rem;color:var(--fg);font-weight:400}
label.rad input{width:auto;flex:none}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eye{display:inline-flex;align-items:center;gap:6px}
.eye svg{width:18px;height:18px}
.eye[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
body.oculto .pos,body.oculto .neg{color:inherit!important}
body.oculto .an-list,body.oculto .evo,body.oculto .cal-row .d,body.oculto .dbars,body.oculto .cv-bars,body.oculto .bars,body.oculto .chip.gan,body.oculto .chip.per,body.oculto .gl-sum,body.oculto .cv-leg{filter:blur(7px);pointer-events:none;user-select:none}
.chip.liberadas,.chip.derechos,.chip.split{background:var(--warn-soft);color:var(--warn)}
.hint{grid-column:1/-1;font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:5px;padding:8px 10px;margin:0}
.esp-sel{max-width:280px}
.evo svg{width:100%;height:190px;display:block}
.evo-x{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-family:var(--f-num);margin-top:4px}
.sim-form{margin-top:4px}
.sim-out{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.alerts-inline{margin:0;padding:10px 12px;border-radius:5px;background:var(--warn-soft);font-size:.86rem}
.cal-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:0}
.cal-row.mine{background:var(--accent-soft)}
.cal-row .nm{min-width:0}.cal-row .nm .full{font-weight:600}
.cal-row .nm small{display:block;color:var(--muted);font-size:.8rem}
.cal-row .px{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.9rem}
.cal-row .px .d{font-size:.8rem;color:var(--gain)}
.cal-form{margin-bottom:6px}
details.fold{gap:0;padding:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:14px 44px 14px 16px;position:relative;border-radius:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.fold>summary:hover{background:var(--sunk)}
.fold-t{font-family:var(--f-display);font-weight:600;font-size:1.1rem}
.fold-s{font-size:.82rem;color:var(--muted)}
.fold-b{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.an-list{display:flex;flex-direction:column;gap:8px}
.an-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.86rem}
.an-l{min-width:0}.an-l small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-track{position:relative;height:12px;background:var(--sunk);border-radius:3px}
.an-fill{height:100%;background:var(--accent);border-radius:3px}
.an-fill.over{background:var(--loss)}
.an-lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);transform:translateX(-1px)}
.an-p{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.an-lims{display:flex;flex-wrap:wrap;gap:12px}
.an-lims label{max-width:180px}
nav.tabs button.aviso{position:relative}
nav.tabs button.aviso::after{content:"";position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
@media (max-width:700px){
  .wrap{padding-block:14px calc(150px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.45rem}

/* ---------- Historial del valor de cada cartera (para la gráfica de evolución) ---------- */
function registrarHistorial(){
  if(demo) return false;
  const hoy=todayStr(); let cambio=false;
  store.hist=store.hist||{};
  store.carteras.forEach(c=>{
    const R=calcular(store.movs.filter(m=>m.cartera===c.id),store.precios,hoy);
    const h=store.hist[c.id]=store.hist[c.id]||{};
    if(!R.posiciones.length && !(R.letras&&R.letras.vivas.length) && !Object.keys(h).length) return;
    const val=[Math.round((R.mercado+R.letras.valorHoy)*100)/100,Math.round((R.costeVivo+R.letras.coste)*100)/100];
    if(!h[hoy]||h[hoy][0]!==val[0]||h[hoy][1]!==val[1]){ h[hoy]=val; cambio=true; }
    const ks=Object.keys(h).sort(); if(ks.length>3000) ks.slice(0,ks.length-3000).forEach(k=>delete h[k]);
  });
  if(cambio) guardar();
  return cambio;
}
function serieRegistrada(){
  const ids=store.activa==='todas'?store.carteras.map(c=>c.id):[store.activa];
  const hs=ids.map(id=>(store.hist||{})[id]||{});
  const fechas=[...new Set(hs.flatMap(h=>Object.keys(h)))].sort();
  const ult=hs.map(()=>null);
  return fechas.map(f=>{ let v=0,c=0; hs.forEach((h,i)=>{ if(h[f]) ult[i]=h[f]; if(ult[i]){v+=ult[i][0];c+=ult[i][1];} }); return {f,v,c}; });
}

  const tot=pos.reduce((s,p)=>s+p.v,0);

/* ---------- Motor de cálculo ---------- */
function ordenar(movs){return movs.slice().sort((a,b)=> a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.seq||0)-(b.seq||0));}

function calcular(movs, precios, hoy){
  const ord = ordenar(movs);
  const LT=calcularLetras(movs,hoy);
  const lotes = {}; // valor -> [{fecha,qty,cpu}]
  const ventas = [], divs = [], errores = [], derechos = [];
  const comprasPorValor = {};
  const difer = {};
  let comisiones = 0;
  ord.forEach((mv,idx)=>{ if(mv.tipo==='compra'){(comprasPorValor[mv.valor]=comprasPorValor[mv.valor]||[]).push({fecha:mv.fecha,qty:mv.titulos,idx,mid:mv.id});} });

  ord.forEach((mv,idx)=>{
    const L = lotes[mv.valor] = lotes[mv.valor]||[];
    if(mv.tipo==='compra'){
      const coste = mv.titulos*mv.precio + (mv.gastos||0);
      comisiones += (mv.gastos||0);
      L.push({fecha:mv.fecha,qty:mv.titulos,cpu:coste/mv.titulos,orig:mv.titulos,mid:mv.id});
    } else if(mv.tipo==='venta'){
      comisiones += (mv.gastos||0);
      let rest = mv.titulos, adq = 0, peso = 0; const usados=[];
      while(rest>1e-9 && L.length){
        const l=L[0]; const q=Math.min(rest,l.qty);
        adq += q*l.cpu; peso += q*l.cpu*days(l.fecha,mv.fecha);
        usados.push({fecha:l.fecha,qty:q,cpu:l.cpu,mid:l.mid});
        l.qty-=q; rest-=q; if(l.qty<=1e-9) L.shift();
      }
      const vendidas = mv.titulos-rest;
      const transm = vendidas*mv.precio - (mv.gastos||0)*(mv.titulos? vendidas/mv.titulos:1);
      const gp = transm-adq;
      const saldoTras = L.reduce((s,l)=>s+l.qty,0);
      const v = {mov:mv,idx,valor:mv.valor,fecha:mv.fecha,qty:vendidas,transm,adq,gp,usados,
        diasMedio: adq>0? peso/adq : 0, saldoTras, faltan:rest>1e-9?rest:0, quedan:Object.fromEntries(L.map(l=>[l.mid,l.qty])), difInt:0, difDet:[], recompras:[],
        noComputable:0, recompra:0, ventanaHasta:addMonths(mv.fecha,2), ventanaAbierta:false};
      if(v.faltan) errores.push(`Venta de ${mv.valor} del ${fmtD(mv.fecha)}: vendes ${NUM.format(mv.titulos)} títulos pero solo tenías ${NUM.format(vendidas)} registrados.`);
      ventas.push(v);
    } else if(mv.tipo==='dividendo'){
      divs.push({mov:mv,valor:mv.valor,fecha:mv.fecha,bruto:mv.bruto||0,ret:mv.retencion||0,neto:(mv.bruto||0)-(mv.retencion||0)});
    } else if(mv.tipo==='liberadas'){
      /* Acciones totalmente liberadas (art. 37.1.a LIRPF): el coste se reparte entre antiguas y nuevas; antigüedad de las de origen */
      const tot=L.reduce((s,l)=>s+l.qty,0);
      if(tot<=1e-9) errores.push(`Acciones liberadas de ${mv.valor} del ${fmtD(mv.fecha)}: no tenías títulos de ese valor en esa fecha.`);
      else L.forEach(l=>{const add=mv.titulos*l.qty/tot; l.cpu=l.cpu*l.qty/(l.qty+add); l.qty+=add;});
    } else if(mv.tipo==='split'){
      const r=mv.antiguas>0&&mv.nuevas>0?mv.nuevas/mv.antiguas:(mv.ratio>0?mv.ratio:1);
      L.forEach(l=>{l.qty*=r; l.cpu/=r;});
    } else if(mv.tipo==='derechos'){
      /* Venta de derechos de valores cotizados: ganancia patrimonial íntegra desde 2017, con retención */
      comisiones += (mv.gastos||0);
      derechos.push({mov:mv,valor:mv.valor,fecha:mv.fecha,importe:(mv.bruto||0)-(mv.gastos||0),bruto:mv.bruto||0,gastos:mv.gastos||0,ret:mv.retencion||0});
    }
  });

  /* Regla de los dos meses (art. 33.5.f LIRPF), procedimiento DGT V0248-18 */
  ventas.forEach(v=>{
    if(v.gp >= -0.005 || v.qty<=0) return;
    const desde = addMonths(v.fecha,-2), hasta = v.ventanaHasta;
    const compras = comprasPorValor[v.valor]||[];
    let antes=0, despues=0;
    compras.forEach(c=>{
      if(c.idx<v.idx && c.fecha>=desde) antes+=c.qty;
      else if(c.idx>v.idx && c.fecha<=hasta) despues+=c.qty;
    });
    const recAntes = Math.min(antes, v.saldoTras);
    const rec = Math.min(v.qty, recAntes + despues);
    v.recompra = rec;
    v.noComputable = -v.gp * (rec/v.qty);
    v.ventanaAbierta = hasta >= hoy;
    /* La pérdida no computable queda ligada a los títulos recomprados y se integra cuando se vendan (art. 33.5.f LIRPF) */
    if(rec>1e-9){
      const porAcc=v.noComputable/rec; let capA=Math.min(recAntes,rec), rem=rec;
      const asignar=(c,q)=>{const d=difer[c.mid]=difer[c.mid]||{valor:v.valor,fecha:c.fecha,mid:c.mid,titulos:0,importe:0,restantes:0,desde:v.idx};
        d.titulos+=q; d.importe+=q*porAcc; d.restantes+=q; d.desde=Math.min(d.desde,v.idx); v.recompras.push({fecha:c.fecha,qty:q});};
      compras.filter(c=>c.idx<v.idx&&c.fecha>=desde).sort((a,b)=>b.idx-a.idx).forEach(c=>{
        if(capA<=1e-9) return; const libre=(v.quedan[c.mid]||0)-((difer[c.mid]||{}).titulos||0); const q=Math.min(capA,libre);
        if(q>1e-9){asignar(c,q);capA-=q;rem-=q;} });
      compras.filter(c=>c.idx>v.idx&&c.fecha<=hasta).sort((a,b)=>a.idx-b.idx).forEach(c=>{
        if(rem<=1e-9) return; const libre=c.qty-((difer[c.mid]||{}).titulos||0); const q=Math.min(rem,libre);
        if(q>1e-9){asignar(c,q);rem-=q;} });
    }
  });
  /* Integración de pérdidas aplazadas al vender los títulos recomprados */
  ventas.forEach(v=>{ v.usados.forEach(u=>{ const d=difer[u.mid]; if(!d||d.restantes<=1e-9||v.idx<=d.desde) return;
    const q=Math.min(u.qty,d.restantes); const imp=q*d.importe/d.titulos; d.restantes-=q; v.difInt+=imp; v.difDet.push({fecha:d.fecha,qty:q,importe:imp}); }); });
  const diferidas=Object.values(difer).filter(d=>d.restantes>1e-9).map(d=>({valor:d.valor,fecha:d.fecha,titulos:d.restantes,importe:d.restantes*d.importe/d.titulos}));

  /* Posiciones abiertas */
  const posiciones = [];
  Object.keys(lotes).sort().forEach(val=>{
    const L=lotes[val]; const qty=L.reduce((s,l)=>s+l.qty,0); if(qty<=1e-9) return;
    const coste=L.reduce((s,l)=>s+l.qty*l.cpu,0);
    const pe = precios[val]; const precio = pe? pe.p : NaN;
    const mercado = isFinite(precio)? qty*precio : NaN;
    const diasMedio = L.reduce((s,l)=>s+l.qty*l.cpu*days(l.fecha,hoy),0)/coste;
    const divVal = divs.filter(d=>d.valor===val).reduce((s,d)=>s+d.bruto,0);
    posiciones.push({valor:val,qty,coste,pm:coste/qty,precio,fechaPrecio:pe?pe.f:'',mercado,latente:mercado-coste,diasMedio,lotes:L.length,divVal});
  });

  /* Agregados */
  const realizado = ventas.reduce((s,v)=>s+v.gp,0) + derechos.reduce((s,d)=>s+d.importe,0);
  const latente = posiciones.reduce((s,p)=>s+(isFinite(p.latente)?p.latente:0),0);
  const sinPrecio = posiciones.filter(p=>!isFinite(p.precio)).map(p=>p.valor);
  const divBruto = divs.reduce((s,d)=>s+d.bruto,0), divRet = divs.reduce((s,d)=>s+d.ret,0);
  const totalCompras = ord.filter(m=>m.tipo==='compra').reduce((s,m)=>s+m.titulos*m.precio+(m.gastos||0),0);
  const costeVendido = ventas.reduce((s,v)=>s+v.adq,0);
  const costeVivo = posiciones.reduce((s,p)=>s+p.coste,0);
  const mercado = posiciones.reduce((s,p)=>s+(isFinite(p.mercado)?p.mercado:p.coste),0);
  const total = realizado + latente + divBruto + LT.cobrado + LT.devengado;

  /* Periodo medio invertido (ponderado por coste): lotes cerrados hasta la venta, abiertos hasta hoy */
  let pesoD=0, pesoC=0;
  ventas.forEach(v=>{ v.usados.forEach(u=>{pesoD+=u.qty*u.cpu*days(u.fecha,v.fecha); pesoC+=u.qty*u.cpu;}); });
  posiciones.forEach(p=>{ pesoD+=p.diasMedio*p.coste; pesoC+=p.coste; });
  const diasMedio = pesoC>0? pesoD/pesoC : 0;

  /* Capital medio comprometido = coste·días / días del periodo */
  const primera = ord.length? ord[0].fecha : hoy;
  const span = Math.max(1, days(primera, hoy));
  const capitalMedio = pesoD/span;

  /* TIR (XIRR) de flujos: compras −, ventas +, dividendos brutos +, valor actual + */
  const flujos=[];
  ord.forEach(m=>{
    if(m.tipo==='compra') flujos.push([m.fecha,-(m.titulos*m.precio+(m.gastos||0))]);
    else if(m.tipo==='venta') flujos.push([m.fecha,m.titulos*m.precio-(m.gastos||0)]);
    else if(m.tipo==='dividendo') flujos.push([m.fecha,m.bruto||0]);
    else if(m.tipo==='derechos') flujos.push([m.fecha,(m.bruto||0)-(m.gastos||0)]);
  });
  if(mercado>0) flujos.push([hoy,mercado]);
  const tir = xirr(flujos);

  /* Por año fiscal */
  const anios = {};
  const A = y => anios[y] = anios[y] || {anio:y,ventas:[],divs:[],der:[],derImp:0,derRet:0,gan:0,per:0,noComp:0,difInt:0,divBruto:0,divRet:0,let:[],letRend:0};
  ventas.forEach(v=>{const a=A(v.fecha.slice(0,4)); a.ventas.push(v); if(v.gp>=0) a.gan+=v.gp; else {a.per+=v.gp+v.noComputable; a.noComp+=v.noComputable;} if(v.difInt>0){a.per-=v.difInt; a.difInt+=v.difInt;}});
  divs.forEach(d=>{const a=A(d.fecha.slice(0,4)); a.divs.push(d); a.divBruto+=d.bruto; a.divRet+=d.ret;});
  derechos.forEach(d=>{const a=A(d.fecha.slice(0,4)); a.der.push(d); a.derImp+=d.importe; a.derRet+=d.ret; if(d.importe>=0) a.gan+=d.importe; else a.per+=d.importe;});
  /* Letras del Tesoro: rendimiento del capital mobiliario en el año de vencimiento o venta */
  LT.liq.forEach(x=>{const a=A(x.fecha.slice(0,4)); a.let.push(x); a.letRend+=x.rend;});
  /* Arrastre de saldos negativos de G/P de los 4 ejercicios anteriores (art. 49 LIRPF), del más antiguo al más reciente */
  let arrastre = []; // [{anio, importe}]
  Object.keys(anios).sort().forEach(y=>{
    const a=anios[y];
    arrastre = arrastre.filter(x=>Number(y)-Number(x.anio)<=4 && x.importe>0.005);
    a.saldoGP = a.gan + a.per;
    let gp=a.saldoGP, rcm=a.divBruto+(a.letRend||0), compensa=0, arrUsado=0; let rcmNeg=0; if(rcm<0){rcmNeg=-rcm; rcm=0;}
    // 1) Pérdidas de años anteriores contra el saldo positivo de G/P
    for(const x of arrastre){ if(gp<=0) break; const u=Math.min(x.importe,gp); x.importe-=u; gp-=u; arrUsado+=u; }
    // 2) Pérdidas de años anteriores contra hasta el 25 % de los dividendos
    let limite=.25*rcm;
    for(const x of arrastre){ if(limite<=0) break; const u=Math.min(x.importe,limite); x.importe-=u; limite-=u; rcm-=u; arrUsado+=u; }
    // 3) Saldo negativo del propio año contra el 25 % restante de dividendos
    let pendiente=0;
    if(gp<0){ compensa=Math.min(-gp, Math.max(0,limite)); rcm-=compensa; pendiente=-gp-compensa; gp=0; }
    a.arrUsado=arrUsado; a.compensa=compensa; a.pendiente=pendiente;
    if(rcmNeg>0&&gp>0){const c=Math.min(rcmNeg,.25*gp); gp-=c; rcmNeg-=c; a.compRCM=c;} a.rcmPend=rcmNeg;
    a.base=Math.max(0,gp)+rcm; a.cuota=cuotaAhorro(a.base); a.resultado=a.cuota-a.divRet-a.derRet;
    arrastre = arrastre.filter(x=>x.importe>0.005);
    if(pendiente>0.005) arrastre.push({anio:y,importe:pendiente});
    a.arrastreSiguiente = arrastre.reduce((s,x)=>s+x.importe,0);
  });

  return {letras:LT,derechos,diferidas,ord,ventas,divs,posiciones,errores,realizado,latente,sinPrecio,divBruto,divRet,totalCompras,costeVendido,costeVivo,mercado,total,diasMedio,capitalMedio,tir,anios,comisiones,primera};
}

function xirr(fl){
  if(fl.length<2) return NaN;
  if(!fl.some(f=>f[1]<0)||!fl.some(f=>f[1]>0)) return NaN;
  const t0=parseD(fl[0][0]);
  const ts=fl.map(f=>(parseD(f[0])-t0)/(365*86400000));
  if(Math.max(...ts)<1/365) return NaN;
  const f=r=>fl.reduce((s,x,i)=>s+x[1]/Math.pow(1+r,ts[i]),0);
  let lo=-0.9999, hi=10, flo=f(lo), fhi=f(hi);
  if(flo*fhi>0) return NaN;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}

/* ---------- Comparativa con el IBEX 35 ----------
   Cartera espejo: cada compra y cada venta tuya se replica, con los mismos euros y el mismo día,
   en el fondo cotizado Amundi IBEX 35 UCITS ETF (BME:LYXIB). Google Finance no ofrece el índice. */
const IDX_TICKER='LYXIB', IDX_NOMBRE='Amundi IBEX 35 UCITS ETF (BME:LYXIB)';
let indice={h:[],p:NaN,f:''}; // h: [[aaaa-mm-dd, cierre]] ascendente; p: último precio; f: fecha del último precio
function cierreEn(f){ const h=indice.h; if(!h.length||f<h[0][0]) return NaN; let lo=0,hi=h.length-1; while(lo<hi){const m=(lo+hi+1)>>1; if(h[m][0]<=f) lo=m; else hi=m-1;} return h[lo][1]; }
function precioIndiceHoy(){ if(indice.p>0) return {p:indice.p,f:indice.f}; const u=indice.h[indice.h.length-1]; return u?{p:u[1],f:u[0]}:{p:NaN,f:''}; }
function comparativa(R,hoy){
  if(!indice.h.length) return null;
  const ph=precioIndiceHoy(); if(!(ph.p>0)) return null;
  let u=0, inv=0, cob=0, falta=0, primeraFalta='';
  const fl=[];
  for(const m of R.ord){
    if(m.tipo!=='compra'&&m.tipo!=='venta') continue;
    const imp = m.tipo==='compra'? m.titulos*m.precio+(m.gastos||0) : m.titulos*m.precio-(m.gastos||0);
    const c=cierreEn(m.fecha); if(!(c>0)){ falta++; if(!primeraFalta) primeraFalta=m.fecha; continue; }
    if(m.tipo==='compra'){ u+=imp/c; inv+=imp; fl.push([m.fecha,-imp]); }
    else { u-=imp/c; cob+=imp; fl.push([m.fecha,imp]); }
  }
  if(falta) return {falta,primeraFalta};
  if(inv<=0) return null;
  const valIdx=u*ph.p;
  const tu=cob+R.mercado-inv, idx=cob+valIdx-inv;
  const larga = days(R.primera,hoy)>=365;
  const tirTu = larga? xirr(fl.concat([[hoy,R.mercado]])) : NaN;
  const tirIdx = larga? xirr(fl.concat([[hoy,valIdx]])) : NaN;
  return {inv,cob,tu,idx,dif:tu-idx,valIdx,mercado:R.mercado,pTu:tu/inv,pIdx:idx/inv,tirTu,tirIdx,precio:ph.p,fechaP:ph.f,desde:R.primera};
}
function panelComparativa(R,hoy){
  const tit='<h2>¿Lo haces mejor que el IBEX 35?</h2>';
  if(!indice.h.length) return `<div class="panel">${tit}<p class="note">${textoSinIndice()}</p></div>`;
  const c=comparativa(R,hoy);
  if(!c) return '';
  if(c.falta) return `<div class="panel">${tit}<p class="note">No se puede comparar: tienes operaciones desde el ${fmtD(c.primeraFalta)} y el primer dato del índice disponible es del ${fmtD(indice.h[0][0])}.</p></div>`;
  const mx=Math.max(1,Math.abs(c.tu),Math.abs(c.idx));
  const fila=(lbl,x,det)=>{const w=(Math.abs(x)/mx*100).toFixed(1);return `<div class="dbar"><span class="num"><b>${lbl}</b></span><div class="track" role="img" aria-label="${lbl}: ${sgn(x)}"><div class="half l">${x<0?`<div class="fill p" style="width:${w}%"></div>`:''}</div><div class="half r">${x>0?`<div class="fill g" style="width:${w}%"></div>`:''}</div></div><span class="num val ${cls(x)}">${sgn(x)}</span><span class="det">${det}</span></div>`;};
  const veredicto = oculto? 'Resultado oculto' : Math.abs(c.dif)<0.5 ? 'Igual que el IBEX' : c.dif>0 ? 'Mejor que el IBEX' : 'Peor que el IBEX';
  return `<div class="panel">
    <div class="cv-head">${tit}<span class="chip ${oculto?'':c.dif>=0?'gan':'per'}">${veredicto}</span></div>
    <div class="cv-sum">
      <div><span class="k">Tu cartera</span><span class="v ${cls(c.tu)}">${sgn(c.tu)}</span><span class="s ${cls(c.tu)}">${pct(c.pTu)}</span></div>
      <div><span class="k">IBEX 35</span><span class="v ${cls(c.idx)}">${sgn(c.idx)}</span><span class="s ${cls(c.idx)}">${pct(c.pIdx)}</span></div>
      <div><span class="k">Diferencia</span><span class="v ${cls(c.dif)}">${sgn(c.dif)}</span><span class="s muted">${oculto?'':c.dif>=0?'a tu favor':'en tu contra'}</span></div>
    </div>
    <div class="dbars">${fila('Tú',c.tu,'compras y ventas reales + valor actual')}${fila('IBEX',c.idx,'mismos euros y fechas en el índice')}</div>
    ${isFinite(c.tirTu)&&isFinite(c.tirIdx)?`<p class="note">TIR anualizada: tú ${pct(c.tirTu)} · IBEX ${pct(c.tirIdx)}.</p>`:''}
    <p class="note">Si cada euro que has invertido desde el ${fmtD(c.desde)} lo hubieras metido el mismo día en el IBEX 35 (y sacado cuando vendiste), hoy llevarías un resultado de ${sgn(c.idx)} en vez de ${sgn(c.tu)}. Porcentajes sobre ${eur(c.inv)} invertidos en compras.</p>
    <details><summary class="note"><b>Cómo se calcula</b></summary><ul class="note-list">
      <li>Se compara solo la evolución del precio, <b>sin dividendos en ninguno de los dos lados</b>: ni los que has cobrado tú${R.divBruto>0.005?' ('+eur(R.divBruto)+' brutos)':''} ni los del índice. Así la comparación es justa.</li>
      <li>Referencia: ${IDX_NOMBRE}, un fondo cotizado que replica el IBEX 35. Google Finance no ofrece el índice. El fondo cobra una comisión pequeña, así que el índice real puede ir ligeramente por encima.</li>
      <li>Se usa el precio de cierre del fondo del día de cada operación (o del último día de bolsa anterior) y, para hoy, el último precio disponible: ${EUR40.format(c.precio)} € del ${fmtD(c.fechaP)}.</li>
      <li>Tus valores sin precio actual cuentan a coste. Comisiones incluidas en tu lado; en el del índice no se añaden comisiones.</li>
    </ul></details>
  </div>`;
}
function parseFechaCSV(s){ s=String(s||'').trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[1]+'-'+m[2]+'-'+m[3]:''; }

/* ---------- Previsión de dividendos a 12 meses ----------
   Solo usa datos que existen: dividendos con importe en el calendario y dividendos que ya cobraste en los
   últimos 12 meses (se supone que se repetirán en la misma fecha con el mismo importe por acción). */
function titulosEn(ord,t,f){ let q=0; for(const m of ord){ if(m.valor!==t) continue; if(m.fecha>=f) break;
  if(m.tipo==='compra'||m.tipo==='liberadas') q+=m.titulos; else if(m.tipo==='venta') q-=m.titulos;
  else if(m.tipo==='split'){ const r=m.antiguas>0&&m.nuevas>0?m.nuevas/m.antiguas:(m.ratio>0?m.ratio:1); q*=r; } } return Math.max(0,q); }
function prevision(R,hoy){
  const ini=hoy.slice(0,7)+'-01', finV=addMonths(ini,12);
  const meses=[]; for(let i=0;i<12;i++){ meses.push({k:addMonths(ini,i).slice(0,7),tot:0}); }
  const items=[], sinDatos=[];
  const pos=new Map(R.posiciones.map(p=>[p.valor,p]));
  const cal=calendario();
  pos.forEach((p,t)=>{
    const deCal=cal.filter(d=>d.t===t && d.imp>0).map(d=>({f:d.pago||d.ex,d})).filter(x=>x.f>=hoy && x.f<finV);
    deCal.forEach(x=>items.push({t,f:x.f,qty:p.qty,ps:x.d.imp,imp:p.qty*x.d.imp,fuente:x.d.estado==='confirmado'?'calendario (confirmado)':'calendario (estimado)'}));
    const desde=addMonths(hoy,-12);
    R.divs.filter(d=>d.valor===t && d.fecha>desde && d.fecha<=hoy).forEach(d=>{
      const q0=titulosEn(R.ord,t,d.fecha); if(!(q0>0)) return;
      const f=addMonths(d.fecha,12); if(f<hoy||f>=finV) return;
      if(deCal.some(x=>Math.abs(days(x.f,f))<=45)) return;
      const ps=d.bruto/q0; items.push({t,f,qty:p.qty,ps,imp:p.qty*ps,fuente:'repite el cobrado el '+fmtD(d.fecha)});
    });
    if(!items.some(i=>i.t===t)){
      const est=cal.filter(d=>d.t===t && !(d.imp>0) && fechaClave(d)>=hoy.slice(0,7));
      sinDatos.push({t,txt:est.length?'previsto '+textoFecha(est[0])+', sin importe':'sin dividendos conocidos'});
    }
  });
  items.sort((a,b)=>a.f<b.f?-1:1);
  items.forEach(i=>{ const m=meses.find(x=>x.k===i.f.slice(0,7)); if(m) m.tot+=i.imp; });
  return {meses,items,sinDatos,total:items.reduce((s,i)=>s+i.imp,0)};
}
function panelPrevision(R,hoy){
  const P=prevision(R,hoy);
  const mx=Math.max(1,...P.meses.map(m=>m.tot));
  const corto=v=>oculto?'•••':NUM0.format(Math.round(v))+' €';
  const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const body = !R.posiciones.length ? '<p class="note">No tienes posiciones abiertas: no hay dividendos que prever.</p>' : !P.items.length ? `<p class="note">Ninguno de tus valores tiene un dividendo con importe conocido en los próximos 12 meses.</p>${P.sinDatos.length?`<p class="note"><b>Sin importe previsto:</b> ${P.sinDatos.map(s=>esc(nombre(s.t)||s.t)+' ('+esc(s.txt)+')').join('; ')}. Si conoces el dividendo de alguno, añádelo con su importe en «Dividendos en los próximos 3 meses».</p>`:''}` : `
    <div class="cv-sum pv-sum">
      <div><span class="k">Brutos previstos</span><span class="v">${eur(P.total)}</span><span class="s muted">próximos 12 meses</span></div>
      <div><span class="k">Netos aprox.</span><span class="v">${eur(P.total*0.81)}</span><span class="s muted">con retención del 19 %</span></div>
      <div><span class="k">Sobre el coste</span><span class="v">${R.costeVivo>0?pct(P.total/R.costeVivo).replace('+',''):'—'}</span><span class="s muted">rentabilidad por dividendo</span></div>
    </div>
    <div class="pv-bars" role="img" aria-label="Dividendos brutos previstos por mes">${P.meses.map(m=>{const [y,mm]=m.k.split('-');return `<div class="pv-col"><span class="pv-v">${m.tot>0.5?corto(m.tot):''}</span><div class="pv-t"><div class="pv-f" style="height:${(m.tot/mx*100).toFixed(1)}%"></div></div><span class="pv-m">${MES3[+mm-1]}${mm==='01'?'<br>'+y.slice(2):''}</span></div>`;}).join('')}</div>
    ${P.items.length?`<div class="mk-list">${P.items.map(i=>`<div class="mk-row"><div class="nm"><span class="full">${esc(nombre(i.t)||i.t)}</span><small style="white-space:normal">${fmtD(i.f)} · ${NUM.format(i.qty)} acc. × ${EUR4.format(i.ps)} € · ${esc(i.fuente)}</small></div><div class="px"><div>${eur(i.imp)}</div></div><span></span></div>`).join('')}</div>`:''}
    ${P.sinDatos.length?`<p class="note"><b>Sin importe previsto:</b> ${P.sinDatos.map(s=>esc(nombre(s.t)||s.t)+' ('+esc(s.txt)+')').join('; ')}. Si conoces el dividendo, añádelo con su importe en «Dividendos en los próximos 3 meses».</p>`:''}`;
  return `<details class="panel fold" data-fold="prev" ${fold.prev?'open':''}>
    <summary><span class="fold-t">Previsión de dividendos · 12 meses</span><span class="fold-s">${R.posiciones.length?(P.total>0.005?'≈ '+eur(P.total)+' brutos':'sin importes conocidos'):'sin posiciones'}</span></summary>
    <div class="fold-b">${body}
    <p class="note">Es una estimación con tus títulos actuales. Solo cuenta los dividendos con importe en el calendario y los que ya cobraste en los últimos 12 meses, suponiendo que se repiten en la misma fecha y con el mismo importe por acción. Las empresas pueden cambiar o suprimir el dividendo. La retención española es del 19 %; en valores extranjeros (por ejemplo, ArcelorMittal) puede haber otra retención en origen.</p>
    </div></details>`;
}

/* ---------- Evolución reconstruida con cierres semanales ----------
   Para los días anteriores al primer registro diario, el valor de la cartera se recalcula con los precios de
   cierre semanales de Google Finance (columnas J en adelante de la hoja de precios). */
let histPrecios={}; // ticker -> [[aaaa-mm-dd, cierre]] ascendente
function fechaHist(s){ s=String(s||'').trim(); if(/^\d{4,6}([.,]\d+)?$/.test(s)){ const n=Math.floor(Number(s.replace(',','.'))); const d=new Date(Date.UTC(1899,11,30)+n*86400000); return d.toISOString().slice(0,10); } return parseFechaCSV(s); }
function leerHistPrecios(filas,k0){
  const cab=filas[0]||[], out={};
  for(let k=(k0==null?9:k0);k<cab.length-1;k++){
    const t=String(cab[k]||'').trim().toUpperCase(), c2=String(cab[k+1]||'').trim().toLowerCase();
    if(!/^[A-Z][A-Z0-9.]{0,7}$/.test(t)||(c2!=='close'&&c2!=='sin datos')) continue;
    const serie=[]; for(let r=1;r<filas.length;r++){ const f=filas[r]; const d=fechaHist(f[k]); const c=numCSV(f[k+1]); if(d&&c>0) serie.push([d,c]); }
    if(serie.length){ serie.sort((a,b)=>a[0]<b[0]?-1:1); out[t]=serie; }
    k++;
  }
  return out;
}
function cierreValor(t,f){ const h=histPrecios[t]; if(!h||!h.length||f<h[0][0]) return NaN; let lo=0,hi=h.length-1; while(lo<hi){const m=(lo+hi+1)>>1; if(h[m][0]<=f) lo=m; else hi=m-1;} return h[lo][1]; }
function serieReconstruida(hasta){
  const movs=state.movs; if(!movs.length) return [];
  const tick=[...new Set(movs.map(m=>m.valor))];
  const hayLetras=movs.some(esLetra);
  if(!tick.some(t=>histPrecios[t]&&histPrecios[t].length) && !hayLetras) return [];
  const ini=ordenar(movs)[0].fecha, fechas=new Set();
  if(hayLetras){ for(let f=ini; f<hasta; f=sumarSemanas(f,1)) fechas.add(f); }
  tick.forEach(t=>(histPrecios[t]||[]).forEach(([d])=>{ if(d>=ini&&d<hasta) fechas.add(d); }));
  movs.forEach(m=>{ if(m.fecha<hasta) fechas.add(m.fecha); });
  return [...fechas].sort().map(f=>{
    const pr={}; tick.forEach(t=>{ const c=cierreValor(t,f); if(c>0) pr[t]={p:c,f}; });
    const R=calcular(movs.filter(m=>m.fecha<=f),pr,f);
    return {f,v:Math.round((R.mercado+R.letras.valorHoy)*100)/100,c:Math.round((R.costeVivo+R.letras.coste)*100)/100,aprox:R.sinPrecio.length>0};
  });
}
function serieEvolucion(){
  const reg=serieRegistrada();
  const hasta=reg.length?reg[0].f:todayStr();
  const rec=serieReconstruida(hasta);
  const s=rec.concat(reg);
  if(rec.length){ s.recHasta=rec[rec.length-1].f; s.aprox=rec.some(p=>p.aprox); }

  const X=f=>PL+(parseD(f)-t0)/dt*(W-PL-PR), Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);

function wireEvolucion(){
  const box=document.getElementById('evo'); if(!box||!evoSerie) return;
  const svg=box.querySelector('svg'), cur=box.querySelector('.evo-cur'), dv=box.querySelector('.evo-dot.v'), dc=box.querySelector('.evo-dot.c'), tip=box.querySelector('.evo-tip');
  const E=evoSerie, ts=E.s.map(p=>parseD(p.f));
  const mostrar=clientX=>{
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const xv=(clientX-r.left)/r.width*E.W; const t=E.t0+(xv-E.PL)/(E.W-E.PL-E.PR)*E.dt;
    let lo=0,hi=ts.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(ts[m]<=t) lo=m; else hi=m;}
    const i=Math.abs(ts[hi]-t)<Math.abs(ts[lo]-t)?hi:lo, p=E.s[i];
    const px=E.X(p.f)/E.W*r.width, yv=E.Y(p.v)/E.H*r.height, yc=E.Y(p.c)/E.H*r.height, top=r.top-box.getBoundingClientRect().top;
    cur.style.left=px+'px'; cur.style.top=top+'px'; cur.style.height=r.height+'px';
    dv.style.left=px+'px'; dv.style.top=(top+yv)+'px'; dc.style.left=px+'px'; dc.style.top=(top+yc)+'px';
    const d=p.v-p.c, rec=E.s.recHasta&&p.f<=E.s.recHasta;
    tip.innerHTML=`<b>${fmtD(p.f)}</b>${rec?' <span class="muted">· semanal</span>':''}<br><i class="k" style="background:var(--accent)"></i>Valor ${eur(p.v)}<br><i class="k" style="background:var(--muted)"></i>Invertido ${eur(p.c)}<br><span class="${cls(d)}">${oculto?'Resultado':d>=0?'Ganas':'Pierdes'} ${sgn(d)}${p.c>0?' ('+pct(d/p.c)+')':''}</span>`;
    [cur,dv,dc,tip].forEach(e=>e.hidden=false);
    const tw=tip.offsetWidth, bw=box.clientWidth; let lx=px+12; if(lx+tw>bw) lx=px-12-tw; if(lx<0) lx=Math.max(0,Math.min(bw-tw,px-tw/2));
    tip.style.left=lx+'px'; tip.style.top=top+'px';
  };
  const ocultar=()=>[cur,dv,dc,tip].forEach(e=>e.hidden=true);
  svg.addEventListener('pointerdown',e=>{ mostrar(e.clientX); });
  svg.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'||e.buttons||e.pressure>0) mostrar(e.clientX); });
  svg.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') ocultar(); });
  svg.addEventListener('touchmove',e=>{ const t=e.touches[0]; if(t) mostrar(t.clientX); },{passive:true});
  document.addEventListener('pointerdown',e=>{ if(!box.contains(e.target)) ocultar(); },{once:false});
  svg.setAttribute('tabindex','0');
  let idx=E.s.length-1;
  svg.addEventListener('keydown',e=>{ if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault(); idx=Math.max(0,Math.min(E.s.length-1,idx+(e.key==='ArrowRight'?1:-1))); const r=svg.getBoundingClientRect(); mostrar(r.left+E.X(E.s[idx].f)/E.W*r.width); });
}

function fechaImp(v){

  if(typeof v==='number' && v>20000 && v<80000) return new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000).toISOString().slice(0,10);
  const s=String(v??'').trim(); let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }

function valorImp(s){

  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===sep){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\r') f+=c; }

  return rows;
}

   Rendimiento implícito = valor de amortización (o de venta) − valor de adquisición (con gastos).

const LETRAS=['letra','letra_venta'];
const esLetra=m=>LETRAS.includes(m.tipo);
const NOMINAL_LETRA=1000;
function nombreLetra(t){ return t&&t.startsWith('LT-')? 'Letra del Tesoro · vence '+fmtD(t.slice(3)) : ''; }
function calcularLetras(movs,hoy){
  const ord=ordenar(movs.filter(esLetra)); const lotes={}, liq=[], avisos=[];
  ord.forEach(m=>{ const L=lotes[m.valor]=lotes[m.valor]||[];
    if(m.tipo==='letra'){ const nom=m.nominal>0?m.nominal:NOMINAL_LETRA; const coste=m.titulos*nom*m.precio/100+(m.gastos||0);
      L.push({mov:m,fecha:m.fecha,venc:m.venc||m.valor.slice(3),n:m.titulos,cpu:coste/m.titulos,nom}); }
    else { const nom=(L[0]||{}).nom||NOMINAL_LETRA, fc=(L[0]||{}).fecha||''; let rest=m.titulos, adq=0;
      while(rest>1e-9&&L.length){ const l=L[0]; const q=Math.min(rest,l.n); adq+=q*l.cpu; l.n-=q; rest-=q; if(l.n<=1e-9) L.shift(); }
      const vend=m.titulos-rest; if(rest>1e-9) avisos.push(`Venta de Letras del ${fmtD(m.fecha)}: vendes ${NUM.format(m.titulos)} pero solo tenías ${NUM.format(vend)} de ese vencimiento.`);
      const tr=(vend*nom*m.precio/100)-(m.gastos||0)*(m.titulos?vend/m.titulos:1);
      liq.push({tipo:'venta',valor:m.valor,fecha:m.fecha,fechaCompra:fc,n:vend,transm:tr,adq,rend:tr-adq,mov:m}); }
  });
  const vivas=[];
  Object.entries(lotes).forEach(([v,L])=>L.forEach(l=>{ if(l.n<=1e-9) return;
    const coste=l.n*l.cpu, nominal=l.n*l.nom, dias=Math.max(1,days(l.fecha,l.venc)), tae=Math.pow(nominal/coste,365/dias)-1;
    if(l.venc<=hoy) liq.push({tipo:'amortizacion',valor:v,fecha:l.venc,fechaCompra:l.fecha,n:l.n,transm:nominal,adq:coste,rend:nominal-coste,mov:l.mov,tae});
    else { const tt=Math.max(0,days(l.fecha,hoy)); vivas.push({valor:v,mov:l.mov,fecha:l.fecha,venc:l.venc,n:l.n,coste,nominal,tae,dias,valorHoy:Math.min(nominal,coste*Math.pow(1+tae,tt/365)),rend:nominal-coste,diasRest:days(hoy,l.venc)}); }
  }));
  liq.sort((a,b)=>a.fecha<b.fecha?-1:1); vivas.sort((a,b)=>a.venc<b.venc?-1:1);
  return {vivas,liq,avisos,valorHoy:vivas.reduce((s,x)=>s+x.valorHoy,0),coste:vivas.reduce((s,x)=>s+x.coste,0),nominal:vivas.reduce((s,x)=>s+x.nominal,0),
    cobrado:liq.reduce((s,x)=>s+x.rend,0),devengado:vivas.reduce((s,x)=>s+x.valorHoy-x.coste,0)};
}

/* ---------- Bloqueo con código: datos cifrados con AES-GCM de 256 bits; clave derivada del código con PBKDF2-SHA256 ---------- */
const LOCK={key:null,salt:null,iter:600000}, LOCK_MIN=2;
let bloqueado=false, colaG=Promise.resolve(), intentos=0, esperaHasta=0, ocultoDesde=0, lockForm='';
const aB64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t);};
const deB64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function derivarClave(codigo,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(codigo),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrarTexto(txt){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},LOCK.key,new TextEncoder().encode(txt)));
  return {enc:1,app:'cartera-inversiones',alg:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter:LOCK.iter,salt:aB64(LOCK.salt),iv:aB64(iv),ct:aB64(ct)};
}
async function abrirSobre(env,codigo){
  const salt=deB64(env.salt), iter=env.iter||600000;
  const key=await derivarClave(codigo,salt,iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:deB64(env.iv)},key,deB64(env.ct));
  return {key,salt,iter,datos:JSON.parse(new TextDecoder().decode(pt))};
}
function sobreGuardado(){ try{ const d=JSON.parse(localStorage.getItem(LSKEY)||'null'); return d&&d.enc?d:null; }catch(e){ return null; } }
async function comprobarCodigo(codigo){ const env=sobreGuardado(); if(!env) return null; try{ return await abrirSobre(env,codigo); }catch(e){ return null; } }

function mostrarBloqueo(msg){
  bloqueado=true; document.body.classList.add('bloqueado');
  let el=$('lock'); if(!el){ el=document.createElement('div'); el.id='lock'; document.body.appendChild(el); }
  el.innerHTML=`<div class="lock-box" role="dialog" aria-modal="true" aria-labelledby="lkT">
    <img src="icon-192.png" alt="" width="72" height="72">

    <p class="err-msg" id="lkE" aria-live="polite" ${msg?'':'hidden'}>${esc(msg||'')}</p>
    <details class="lk-olv"><summary>He olvidado el código</summary>
      <p class="note">El código no se puede recuperar: tus datos están cifrados con él y no se guarda en ningún sitio. La única salida es borrar los datos de este dispositivo y restaurar tu última copia de seguridad desde Ajustes.</p>
      <div id="lkB2"><button class="btn danger small" type="button" id="lkB">Borrar los datos de este dispositivo</button></div>
    </details>
  </div>`;
  const inp=$('lkC'); setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  $('lkF').onsubmit=async e=>{
    e.preventDefault();
    const er=$('lkE'), ok=$('lkOk');
    const fail=t=>{er.textContent=t;er.hidden=false;};
    if(Date.now()<esperaHasta) return fail('Demasiados intentos. Espera '+Math.ceil((esperaHasta-Date.now())/1000)+' segundos.');
    const codigo=inp.value; if(!codigo) return fail('Escribe tu código.');
    ok.disabled=true; ok.textContent='Comprobando…';
    const env=sobreGuardado(); let r=null;
    if(env){ try{ r=await abrirSobre(env,codigo); }catch(x){ r=null; } }
    ok.disabled=false; ok.textContent='Desbloquear';
    if(!env){ ocultarBloqueo(); cargarDatos(null); await arrancar(); return; }
    if(!r){ intentos++; inp.value=''; if(intentos>=5) esperaHasta=Date.now()+Math.min(600000,30000*Math.pow(2,intentos-5)); return fail('Código incorrecto.'+(intentos>=5?' Espera '+Math.ceil((esperaHasta-Date.now())/1000)+' segundos antes de volver a probar.':'')); }
    intentos=0; LOCK.key=r.key; LOCK.salt=r.salt; LOCK.iter=r.iter;
    ocultarBloqueo(); cargarDatos(r.datos); await arrancar();
  };
  $('lkB').onclick=()=>{ $('lkB2').innerHTML=`<p class="note"><b>¿Seguro?</b> Se borrarán todos tus movimientos de este dispositivo. No se puede deshacer.</p><div class="actions"><button class="btn danger small" type="button" id="lkB3">Sí, borrar</button><button class="btn ghost small" type="button" id="lkB4">Cancelar</button></div>`;
    $('lkB3').onclick=()=>{ try{localStorage.removeItem(LSKEY);}catch(e){} LOCK.key=null; LOCK.salt=null; location.reload(); };
    $('lkB4').onclick=()=>mostrarBloqueo(); };
}

function wireBloqueo(){
  const m=t=>{const e=$('lkM'); if(e){e.textContent=t; e.hidden=!t;}};
  const nuevo=()=>{ const a=$('lkN1').value, b=$('lkN2').value; if(a.length<6){m('El código debe tener al menos 6 caracteres.');return null;} if(a!==b){m('Los dos códigos no coinciden.');return null;} return a; };
  const btnBusy=(id,t)=>{const b=$(id); if(b){b.disabled=true; b.textContent=t;}};
  const on=(id,f)=>{const b=$(id); if(b) b.onclick=f;};
  on('lkFA',()=>{lockForm='activar';render();});
  on('lkFC',()=>{lockForm='cambiar';render();});
  on('lkFQ',()=>{lockForm='quitar';render();});
  on('lkCan',()=>{lockForm='';render();});
  on('lkYa',()=>bloquearAhora());
  on('lkAct',async()=>{ const c=nuevo(); if(!c) return; btnBusy('lkAct','Cifrando…');
    LOCK.salt=crypto.getRandomValues(new Uint8Array(16)); LOCK.iter=600000; LOCK.key=await derivarClave(c,LOCK.salt,LOCK.iter);
    guardar(); await colaG; lockForm=''; pintarLock(); render(); toast('Bloqueo activado. Tus datos están cifrados.'); });
  on('lkCam',async()=>{ const act=$('lkA').value; const c=nuevo(); if(!c) return; btnBusy('lkCam','Comprobando…');
    await colaG; const r=await comprobarCodigo(act); if(!r){ m('El código actual no es correcto.'); const b=$('lkCam'); b.disabled=false; b.textContent='Cambiar código'; return; }
    LOCK.salt=crypto.getRandomValues(new Uint8Array(16)); LOCK.key=await derivarClave(c,LOCK.salt,LOCK.iter);
    guardar(); await colaG; lockForm=''; render(); toast('Código cambiado'); });
  on('lkQui',async()=>{ const act=$('lkA').value; btnBusy('lkQui','Comprobando…');
    await colaG; const r=await comprobarCodigo(act); if(!r){ m('El código no es correcto.'); const b=$('lkQui'); b.disabled=false; b.textContent='Quitar bloqueo'; return; }
    LOCK.key=null; LOCK.salt=null; guardar(); lockForm=''; pintarLock(); render(); toast('Bloqueo quitado'); });
}

/* ---------- Precios desde una hoja de Google publicada como CSV ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function numCSV(s){ if(s==null) return NaN; let t=String(s).trim().replace(/[€%\s]/g,''); if(!t) return NaN;
  if(t.includes(',')&&t.includes('.')){ t = t.lastIndexOf(',')>t.lastIndexOf('.') ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,''); }
  else if(t.includes(',')) t=t.replace(',','.');
  return Number(t); }
async function actualizarPrecios(silencioso){
  if(!ajustes.csvUrl || cargandoPrecios || bloqueado) return;
  cargandoPrecios=true; errPrecios=''; if(!silencioso) render();
  try{
    const r=await fetch(ajustes.csvUrl+(ajustes.csvUrl.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('La hoja respondió con error '+r.status+'.');
    const filas=parseCSV(await r.text());
    const hoy=todayStr(), hora=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    let n=0;
    filas.forEach(f=>{
      const t=(f[0]||'').trim().toUpperCase().replace(/^BME:/,''); const p=numCSV(f[1]); const v=numCSV(f[2]);
      if(!t || !(p>0)) return;
      state.precios[t]={p,f:hoy,h:hora,v:isFinite(v)?v:null}; n++;
    });
    if(!n){ if(/cargando|loading/i.test(filas.map(f=>f[1]||'').join(' '))){ reintentarPronto(); throw new Error('Google todavía está calculando los precios de tu hoja (aparece «Cargando…»). La app lo volverá a intentar sola en un minuto.'); } throw new Error('No se encontró ningún precio. Revisa que la columna A tenga el valor y la B el precio.'); }
    /* Histórico del fondo IBEX 35 (columnas E y F) y su precio de hoy (G = LYXIB, H = precio) */
    const h=[]; let pIdx=NaN;
    filas.forEach(f=>{ const d=parseFechaCSV(f[4]); const c=numCSV(f[5]); if(d&&c>0) h.push([d,c]); if((f[6]||'').trim().toUpperCase()===IDX_TICKER){ const p=numCSV(f[7]); if(p>0) pIdx=p; } });
    if(h.length>20){ h.sort((a,b)=>a[0]<b[0]?-1:1); indice={h,p:pIdx,f:pIdx>0?hoy:''}; idxEstado='ok'; try{localStorage.setItem(IDXKEY,JSON.stringify(indice));}catch(e){} }
    else { idxEstado = /cargando|loading/i.test(String((filas[0]||[])[4]||'')+String((filas[0]||[])[7]||'')) ? 'cargando' : 'falta'; if(idxEstado==='cargando') reintentarPronto(); }
    /* Cierres semanales de cada valor (columnas J en adelante) para reconstruir la gráfica de evolución */
    const hp=leerHistPrecios(filas); if(Object.keys(hp).length){ histPrecios=hp; try{localStorage.setItem(HPKEY,JSON.stringify(hp));}catch(e){} }
    /* Histórico semanal en otra pestaña de la hoja (celda D1 = «hist:<gid>»): se descarga como mucho una vez al día */
    const gidF=filas.find(f=>/^hist:\d+$/.test(String(f[3]||'').trim()));
    if(gidF){ const gid=String(gidF[3]).trim().slice(5); const edad=ajustes.histAct?Date.now()-Date.parse(ajustes.histAct):Infinity;
      if(edad>20*3600*1000||!Object.keys(histPrecios).length){ try{
        const u=new URL(ajustes.csvUrl); u.searchParams.set('gid',gid); u.searchParams.set('single','true'); u.searchParams.set('output','csv'); u.searchParams.set('_',Date.now());
        const rh=await fetch(u.toString(),{cache:'no-store'}); if(rh.ok){ const h2=leerHistPrecios(parseCSV(await rh.text()),0);
          if(Object.keys(h2).length>=5){ histPrecios=h2; ajustes.histAct=new Date().toISOString(); try{localStorage.setItem(HPKEY,JSON.stringify(h2));}catch(e){} } }
      }catch(e){} } }
    ajustes.ultimaAct=new Date().toISOString(); guardarAjustes(); guardar(); registrarHistorial();
    if(!silencioso) toast(n+' precios actualizados');
  }catch(e){
    errPrecios = (e && e.name==='TypeError') ? 'No se pudo conectar con la hoja. Comprueba la conexión y que el enlace sea el de "Publicar en la web" en formato CSV.' : (e.message||'Error al leer la hoja.');
    if(!silencioso) toast('No se pudieron actualizar los precios');
  }
  cargandoPrecios=false; render();
}

function empezar(){ store=nuevoStore();sincronizar(); demo=false; guardar(); render(); toast('Ejemplos eliminados. Ya puedes registrar tus movimientos.'); if(ajustes.csvUrl) actualizarPrecios(true); }

/* ---------- Render ---------- */
function render(){
  const hoy=todayStr();
  sincronizar();
  renderCartBar();
  const R = calcular(state.movs,state.precios,hoy);
  renderBanner();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  ['resumen','movimientos','cartera','mercado','fiscal','copia'].forEach(t=>$('v-'+t).hidden = t!==tab);
  const vals=[...new Set([...state.movs.map(m=>m.valor),...SUGERENCIAS])];
  $('valores').innerHTML = vals.map(v=>`<option value="${esc(v)}"></option>`).join('');
  if(tab==='resumen') renderResumen(R,hoy);
  if(tab==='movimientos') renderMovs(R);
  if(tab==='cartera'){ renderCartera(R,hoy); wireAnalisis(); wireFichas($('v-cartera')); wireCarSeg(); }
  if(tab==='mercado') renderMercado(R,hoy);
  if(tab==='fiscal') renderFiscal(calcular(movsFiscales(),store.precios,hoy),hoy);
  if(tab==='copia'){ renderCopia(); wireCarteras(); wireImportar(); }
}

function renderBanner(){
  const b=$('banner');
  if(modo==='cargando'){b.innerHTML='';return;}
  if(demo){
    b.innerHTML=`<div class="banner demo"><p><span class="chip demo">Ejemplo</span> Estás viendo una cartera inventada para que veas cómo funciona. Sus precios no son cotizaciones reales. Al registrar tu primer movimiento, los ejemplos se borran. Si ya usabas la versión de Claude, restaura tu copia desde Ajustes.</p><button class="btn" id="bEmpezar">Empezar con mi cartera</button></div>`;
    $('bEmpezar').onclick=empezar;
  } else {
    const dias = ajustes.ultimaCopia? days(ajustes.ultimaCopia.slice(0,10),todayStr()) : Infinity;
    const toca = store.movs.length && dias>30;
    const nb=document.querySelector('#tabs [data-tab=copia]'); if(nb){ nb.classList.toggle('aviso',!!toca); nb.title=toca?'Toca hacer una copia de seguridad':''; }
    b.innerHTML = (toca && tab==='copia') ? `<div class="banner"><p>${ajustes.ultimaCopia?'Tu última copia de seguridad es de hace '+dias+' días.':'Aún no has hecho ninguna copia de seguridad.'} Tus datos solo están en este dispositivo.</p><button class="btn ghost" id="bCopia">Hacer copia</button></div>` : '';
    const bc=$('bCopia'); if(bc) bc.onclick=()=>{const t=$('eShare')||$('eJson'); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); try{t.focus({preventScroll:true});}catch(e){}}};
  }
}

function kpi(t,v,s,c){return `<div class="kpi"><h3>${t}</h3><div class="v ${c||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}

  R.divs.forEach(d=>{pv(d.valor).d+=d.bruto;});
  const filas = Object.entries(porValor).map(([v,o])=>[v,o.r+o.l+o.d,o]).sort((a,b)=>b[1]-a[1]);
  const maxAbs = Math.max(1,...filas.map(f=>Math.abs(f[1])));
  const P = R.posiciones, Pp = P.filter(p=>isFinite(p.mercado));
  const cvCoste = Pp.reduce((s,p)=>s+p.coste,0), cvValor = Pp.reduce((s,p)=>s+p.mercado,0), cvLat = cvValor-cvCoste;
  const cvMax = Math.max(1,...P.map(p=>Math.max(p.coste, isFinite(p.mercado)?p.mercado:0)));
  const recup = p => { if(!isFinite(p.precio)) return 'sin precio actual: introdúcelo en Cartera';
    const base = 'precio medio '+eur(p.pm)+' · actual '+eur(p.precio);
    if(oculto) return base;
    return p.precio < p.pm ? base+' · necesita subir '+pct(p.pm/p.precio-1).replace('+','')+' para recuperar' : base+' · margen '+pct(1-p.pm/p.precio).replace('+','')+' sobre tu precio medio'; };
  const cartActual = !P.length ? `<div class="panel"><h2>Cartera actual</h2><p class="note">No tienes posiciones abiertas ahora mismo.</p></div>` : `

    </ul>
  </details>
  </div>`;
  wireEvolucion();
}
