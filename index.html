<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartera de Inversiones</title>
<meta name="theme-color" content="#1d5c7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inversiones">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: libro de registro de bolsa — cabecera compacta, pestañas, tablas densas con cifras tabulares */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d5dbdf;
  --fg:#16232b; --muted:#5b6a73; --accent:#1d5c7a; --accent-soft:#dbe8ef;
  --gain:#17774a; --gain-soft:#dcefe4; --loss:#b3261e; --loss-soft:#f7e0dd;
  --warn:#8a5a00; --warn-soft:#f6ead0;
  --f-display:"Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#172229; --sunk:#0c1317; --line:#2a3842;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#7fb8d6; --accent-soft:#1d3442;
  --gain:#5cc58d; --gain-soft:#163627; --loss:#f08a80; --loss-soft:#3b1d1a;
  --warn:#e3b660; --warn-soft:#382b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#172229; --sunk:#0c1317; --line:#2a3842;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#7fb8d6; --accent-soft:#1d3442;
  --gain:#5cc58d; --gain-soft:#163627; --loss:#f08a80; --loss-soft:#3b1d1a;
  --warn:#e3b660; --warn-soft:#382b12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--gain)} .dot.busy{background:var(--warn)} .dot.err{background:var(--loss)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.banner.demo{background:var(--warn-soft);border-color:transparent}
.banner p{margin:0;min-width:0;flex:1 1 320px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:500;line-height:1.2}
.kpi .s{font-size:.8rem;color:var(--muted);font-family:var(--f-num)}

dl.rows{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0}
dl.rows dt{color:var(--muted)} dl.rows dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
dl.rows .total{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--fg)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.chip{display:inline-block;font:600 .7rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.chip.compra{background:var(--accent-soft);color:var(--accent)}
.chip.venta{background:var(--sunk);color:var(--fg)}
.chip.dividendo{background:var(--gain-soft);color:var(--gain)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--loss-soft);color:var(--loss)}
.chip.demo{background:var(--warn-soft);color:var(--warn)}

form.mov{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
input,select{font:400 .95rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 9px;width:100%;min-width:0}
input.numin{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;width:max-content;max-width:100%}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 .88rem var(--f-body);padding:8px 14px;border-radius:4px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--loss);border-color:var(--loss)}
.btn.small{padding:4px 9px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preview{grid-column:1/-1;font-size:.85rem;color:var(--muted);font-family:var(--f-num)}
.err-msg{grid-column:1/-1;color:var(--loss);font-size:.85rem}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{padding:10px 12px;border-radius:5px;background:var(--warn-soft);color:var(--fg);font-size:.88rem}
.alerts li.info{background:var(--sunk)}
.alerts li b{color:var(--warn)}
.note{font-size:.82rem;color:var(--muted);max-width:75ch;margin:0}
.note-list{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:85ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.toolbar .actions label{min-width:140px}
.priceIn{width:96px;padding:5px 7px;font-size:.85rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:5px;font-size:.88rem;max-width:calc(100% - 32px);z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--loss-soft);border-radius:5px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:58px 1fr 110px;gap:10px;align-items:center;font-size:.85rem}
.bar .track{height:12px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .fill.alt{background:var(--muted)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.hero .big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:2.3rem;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.hero .sub{font-family:var(--f-num);font-size:.95rem}
nav.tabs svg{width:20px;height:20px;display:none}
.mob{display:none}
.cards{flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.card .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.card .full{grid-column:1/-1}
.card .meta{font-size:.8rem;color:var(--muted);font-family:var(--f-num)}
.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);font-size:1.9rem;line-height:1;cursor:pointer;z-index:16;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;justify-content:center}
.gl-sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gl-sum div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gl-sum .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.1rem}
.gl-sum .k{font-size:.75rem;color:var(--muted)}
.dbars{display:flex;flex-direction:column;gap:10px}
.dbar{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:4px 10px;align-items:center;font-size:.85rem}
.dbar .track{display:grid;grid-template-columns:1fr 1fr;height:14px}
.dbar .half{display:flex;background:var(--sunk);overflow:hidden}
.dbar .half.l{justify-content:flex-end;border-right:2px solid var(--fg);border-radius:2px 0 0 2px}
.dbar .half.r{border-radius:0 2px 2px 0}
.dbar .fill{height:100%}
.dbar .fill.g{background:var(--gain)} .dbar .fill.p{background:var(--loss)}
.dbar .val{text-align:right}
.dbar .det{grid-column:2/-1;font-size:.75rem;color:var(--muted);font-family:var(--f-num);margin-top:-2px}
.dbar-axis{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:10px;font-size:.72rem;color:var(--muted)}
.dbar-axis div{display:flex;justify-content:space-between}
.cv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.chip.gan{background:var(--gain-soft);color:var(--gain)} .chip.per{background:var(--loss-soft);color:var(--loss)}
.cv-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.cv-sum div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cv-sum .k{font-size:.75rem;color:var(--muted)}
.cv-sum .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.05rem}
.cv-sum .s{font-family:var(--f-num);font-size:.8rem}
.cv-list{display:flex;flex-direction:column;gap:14px}
.cv-row{display:grid;grid-template-columns:52px minmax(0,1fr) 112px;gap:4px 10px;align-items:center;font-size:.85rem}
.cv-bars{display:flex;flex-direction:column;gap:3px}
.cv-bars .t{height:9px;background:var(--sunk);border-radius:2px;overflow:hidden}
.cv-bars .f{height:100%}
.cv-bars .f.coste{background:var(--muted)} .cv-bars .f.g{background:var(--gain)} .cv-bars .f.p{background:var(--loss)}
.cv-row .val{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.3}
.cv-row .det{grid-column:2/-1;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.cv-leg{display:flex;gap:14px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.cv-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mk-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.mk-breadth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mk-breadth div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mk-breadth .k{font-size:.75rem;color:var(--muted)} .mk-breadth .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.1rem}
.mk-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.mk-bar span{display:block;height:100%}
.mk-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mk-tools input{max-width:260px}
.mk-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mk-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mk-row:last-child{border-bottom:0}
.mk-row.mine{background:var(--accent-soft)}
.mk-row .nm{min-width:0}
.mk-row .nm .full{font-weight:600}
.mk-row .nm small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-row .px{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.25}
.mk-row .px .d{font-size:.82rem}
.chip.mine{background:var(--accent);color:var(--surface)}
.cart-bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.cart-bar .cb-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.cart-bar select{width:auto;flex:1 1 200px;max-width:420px}
.cart-bar .cb-n{flex:1 1 auto}
.cart-list{display:flex;flex-direction:column;gap:8px}
.cart-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto auto;gap:8px;align-items:center}
.cart-item .cnt{font-size:.8rem;white-space:nowrap}
.cart-new{display:flex;flex-direction:column;gap:10px;max-width:560px}
.nc-q{border:1px solid var(--line);border-radius:5px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:8px}
.nc-q legend{font-size:.82rem;color:var(--fg);font-weight:600;padding:0 4px}
label.rad{flex-direction:row;align-items:center;gap:8px;font-size:.88rem;color:var(--fg);font-weight:400}
label.rad input{width:auto;flex:none}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eye{display:inline-flex;align-items:center;gap:6px}
.eye svg{width:18px;height:18px}
.eye[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
body.oculto .pos,body.oculto .neg{color:inherit!important}
body.oculto .an-list,body.oculto .evo,body.oculto .cal-row .d,body.oculto .dbars,body.oculto .cv-bars,body.oculto .bars,body.oculto .chip.gan,body.oculto .chip.per,body.oculto .gl-sum,body.oculto .cv-leg{filter:blur(7px);pointer-events:none;user-select:none}
.chip.liberadas,.chip.derechos,.chip.split{background:var(--warn-soft);color:var(--warn)}
.hint{grid-column:1/-1;font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:5px;padding:8px 10px;margin:0}
.esp-sel{max-width:280px}
.evo svg{width:100%;height:190px;display:block}
.evo-x{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-family:var(--f-num);margin-top:4px}
.sim-form{margin-top:4px}
.sim-out{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.alerts-inline{margin:0;padding:10px 12px;border-radius:5px;background:var(--warn-soft);font-size:.86rem}
.cal-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:0}
.cal-row.mine{background:var(--accent-soft)}
.cal-row .nm{min-width:0}.cal-row .nm .full{font-weight:600}
.cal-row .nm small{display:block;color:var(--muted);font-size:.8rem}
.cal-row .px{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.9rem}
.cal-row .px .d{font-size:.8rem;color:var(--gain)}
.cal-form{margin-bottom:6px}
details.fold{gap:0;padding:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:14px 44px 14px 16px;position:relative;border-radius:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.fold>summary:hover{background:var(--sunk)}
.fold-t{font-family:var(--f-display);font-weight:600;font-size:1.1rem}
.fold-s{font-size:.82rem;color:var(--muted)}
.fold-b{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.an-list{display:flex;flex-direction:column;gap:8px}
.an-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.86rem}
.an-l{min-width:0}.an-l small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-track{position:relative;height:12px;background:var(--sunk);border-radius:3px}
.an-fill{height:100%;background:var(--accent);border-radius:3px}
.an-fill.over{background:var(--loss)}
.an-lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);transform:translateX(-1px)}
.an-p{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.an-lims{display:flex;flex-wrap:wrap;gap:12px}
.an-lims label{max-width:180px}
@media (max-width:700px){
  .wrap{padding-block:14px calc(150px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.45rem}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;gap:0;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;padding:8px 2px 7px;border-bottom:0;border-top:2px solid transparent}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent);color:var(--accent)}
  nav.tabs svg{display:block}
  .desk{display:none}
  .mob{display:flex}

  else {imp=(x.bruto||0)-(x.retencion||0); det=`bruto ${eur(x.bruto||0)} · retención ${eur(x.retencion||0)}`; res=`<span class="muted">bruto ${eur(x.bruto||0)}</span>`;}

/* ---------- Historial del valor de cada cartera (para la gráfica de evolución) ---------- */
function registrarHistorial(){
  if(demo) return false;
  const hoy=todayStr(); let cambio=false;
  store.hist=store.hist||{};
  store.carteras.forEach(c=>{
    const R=calcular(store.movs.filter(m=>m.cartera===c.id),store.precios,hoy);
    const h=store.hist[c.id]=store.hist[c.id]||{};
    if(!R.posiciones.length && !Object.keys(h).length) return;
    const val=[Math.round(R.mercado*100)/100,Math.round(R.costeVivo*100)/100];
    if(!h[hoy]||h[hoy][0]!==val[0]||h[hoy][1]!==val[1]){ h[hoy]=val; cambio=true; }
    const ks=Object.keys(h).sort(); if(ks.length>3000) ks.slice(0,ks.length-3000).forEach(k=>delete h[k]);
  });
  if(cambio) guardar();
  return cambio;
}
function serieEvolucion(){
  const ids=store.activa==='todas'?store.carteras.map(c=>c.id):[store.activa];
  const hs=ids.map(id=>(store.hist||{})[id]||{});
  const fechas=[...new Set(hs.flatMap(h=>Object.keys(h)))].sort();
  const ult=hs.map(()=>null);
  return fechas.map(f=>{ let v=0,c=0; hs.forEach((h,i)=>{ if(h[f]) ult[i]=h[f]; if(ult[i]){v+=ult[i][0];c+=ult[i][1];} }); return {f,v,c}; });
}
function panelEvolucion(){
  const s=serieEvolucion();
  if(!s.length) return `<div class="panel"><h2>Evolución de la cartera</h2><p class="note">La gráfica empieza a llenarse hoy: cada día que abras la app con precios actualizados se guarda el valor de tu cartera.</p></div>`;
  if(s.length<2){ const p=s[0]; return `<div class="panel"><h2>Evolución de la cartera</h2><p class="note">Primer registro el ${fmtD(p.f)}: valor ${eur(p.v)}, invertido ${eur(p.c)}. La gráfica aparecerá en cuanto haya un segundo día con precios. Se irá completando sola cada día que abras la app.</p></div>`; }
  const W=640,H=200,PL=6,PR=6,PT=12,PB=6;
  const t0=parseD(s[0].f), t1=parseD(s[s.length-1].f), dt=Math.max(1,t1-t0);
  const vals=s.flatMap(p=>[p.v,p.c]); let mn=Math.min(...vals), mx=Math.max(...vals); const pad=(mx-mn)*0.12||mx*0.05||1; mn-=pad; mx+=pad;
  const X=f=>PL+(parseD(f)-t0)/dt*(W-PL-PR), Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const lv=s.map(p=>`${X(p.f).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' '), lc=s.map(p=>`${X(p.f).toFixed(1)},${Y(p.c).toFixed(1)}`).join(' ');
  const area=`${X(s[0].f).toFixed(1)},${(H-PB).toFixed(1)} ${lv} ${X(s[s.length-1].f).toFixed(1)},${(H-PB).toFixed(1)}`;
  const u=s[s.length-1], dif=u.v-u.c;
  const grid=[0.25,0.5,0.75].map(k=>`<line x1="${PL}" x2="${W-PR}" y1="${(PT+k*(H-PT-PB)).toFixed(1)}" y2="${(PT+k*(H-PT-PB)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  return `<div class="panel">
    <div class="cv-head"><h2>Evolución de la cartera</h2><span class="muted" style="font-size:.8rem">desde ${fmtD(s[0].f)}</span></div>
    <div class="evo"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor de la cartera frente a lo invertido desde el ${fmtD(s[0].f)}" preserveAspectRatio="none">
      ${grid}
      <polygon points="${area}" fill="var(--accent-soft)"/>
      <polyline points="${lc}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
      <polyline points="${lv}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <circle cx="${X(u.f).toFixed(1)}" cy="${Y(u.v).toFixed(1)}" r="4.5" fill="var(--accent)"/>
    </svg><div class="evo-x"><span>${fmtD(s[0].f)}</span><span>${fmtD(u.f)}</span></div></div>
    <div class="cv-leg"><span><i style="background:var(--accent)"></i>Valor de mercado: ${eur(u.v)}</span><span><i style="background:var(--muted)"></i>Invertido (coste): ${eur(u.c)}</span><span class="${cls(dif)}">Diferencia: ${sgn(dif)}</span></div>
  </div>`;
}

/* ---------- Simulador de venta ---------- */
let simIn=null, simRes=null;
function panelSimulador(R,hoy){
  const pos=R.posiciones;

const SECTOR={SAN:'Banca',BBVA:'Banca',CABK:'Banca',SAB:'Banca',BKT:'Banca',UNI:'Banca',MAP:'Seguros',
  IBE:'Eléctricas y gas',ELE:'Eléctricas y gas',NTGY:'Eléctricas y gas',RED:'Eléctricas y gas',ENG:'Eléctricas y gas',
  ANE:'Renovables',SLR:'Renovables',REP:'Petróleo',
  ACS:'Construcción e infraestructuras',FER:'Construcción e infraestructuras',SCYR:'Construcción e infraestructuras',ANA:'Construcción e infraestructuras',
  AENA:'Transporte y turismo',IAG:'Transporte y turismo',AMS:'Transporte y turismo',
  ACX:'Industria y materiales',MTS:'Industria y materiales',FDR:'Industria y materiales',
  TEF:'Telecomunicaciones',CLNX:'Telecomunicaciones',IDR:'Tecnología y defensa',
  ITX:'Consumo y distribución',PUIG:'Consumo y distribución',LOG:'Consumo y distribución',
  GRF:'Salud',ROVI:'Salud',COL:'Inmobiliario',MRL:'Inmobiliario'};
const sectorDe=t=>SECTOR[t]||'Otros';
function limites(){ const l=store.limites||{}; return {valor:l.valor>0?l.valor:25, sector:l.sector>0?l.sector:40}; }
function analisis(R){
  const pos=R.posiciones.map(p=>({t:p.valor,v:isFinite(p.mercado)?p.mercado:p.coste,sinPrecio:!isFinite(p.mercado)}));
  const tot=pos.reduce((s,p)=>s+p.v,0);
  if(!(tot>0)) return null;
  const vals=pos.map(p=>({...p,w:p.v/tot})).sort((a,b)=>b.w-a.w);
  const sm={}; vals.forEach(p=>{const s=sectorDe(p.t); sm[s]=(sm[s]||0)+p.w;});
  const sects=Object.entries(sm).map(([s,w])=>({s,w})).sort((a,b)=>b.w-a.w);
  const L=limites();
  return {vals,sects,L,excV:vals.filter(p=>p.w*100>L.valor+1e-9),excS:sects.filter(x=>x.w*100>L.sector+1e-9)};
}

}

/* ---------- Motor de cálculo ---------- */
function ordenar(movs){return movs.slice().sort((a,b)=> a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.seq||0)-(b.seq||0));}

function calcular(movs, precios, hoy){
  const ord = ordenar(movs);
  const lotes = {}; // valor -> [{fecha,qty,cpu}]
  const ventas = [], divs = [], errores = [], derechos = [];
  const comprasPorValor = {};
  const difer = {};
  let comisiones = 0;
  ord.forEach((mv,idx)=>{ if(mv.tipo==='compra'){(comprasPorValor[mv.valor]=comprasPorValor[mv.valor]||[]).push({fecha:mv.fecha,qty:mv.titulos,idx,mid:mv.id});} });

  ord.forEach((mv,idx)=>{
    const L = lotes[mv.valor] = lotes[mv.valor]||[];
    if(mv.tipo==='compra'){
      const coste = mv.titulos*mv.precio + (mv.gastos||0);
      comisiones += (mv.gastos||0);
      L.push({fecha:mv.fecha,qty:mv.titulos,cpu:coste/mv.titulos,orig:mv.titulos,mid:mv.id});
    } else if(mv.tipo==='venta'){
      comisiones += (mv.gastos||0);
      let rest = mv.titulos, adq = 0, peso = 0; const usados=[];
      while(rest>1e-9 && L.length){
        const l=L[0]; const q=Math.min(rest,l.qty);
        adq += q*l.cpu; peso += q*l.cpu*days(l.fecha,mv.fecha);
        usados.push({fecha:l.fecha,qty:q,cpu:l.cpu,mid:l.mid});
        l.qty-=q; rest-=q; if(l.qty<=1e-9) L.shift();
      }
      const vendidas = mv.titulos-rest;
      const transm = vendidas*mv.precio - (mv.gastos||0)*(mv.titulos? vendidas/mv.titulos:1);
      const gp = transm-adq;
      const saldoTras = L.reduce((s,l)=>s+l.qty,0);
      const v = {mov:mv,idx,valor:mv.valor,fecha:mv.fecha,qty:vendidas,transm,adq,gp,usados,
        diasMedio: adq>0? peso/adq : 0, saldoTras, faltan:rest>1e-9?rest:0, quedan:Object.fromEntries(L.map(l=>[l.mid,l.qty])), difInt:0, difDet:[], recompras:[],
        noComputable:0, recompra:0, ventanaHasta:addMonths(mv.fecha,2), ventanaAbierta:false};
      if(v.faltan) errores.push(`Venta de ${mv.valor} del ${fmtD(mv.fecha)}: vendes ${NUM.format(mv.titulos)} títulos pero solo tenías ${NUM.format(vendidas)} registrados.`);
      ventas.push(v);
    } else if(mv.tipo==='dividendo'){
      divs.push({mov:mv,valor:mv.valor,fecha:mv.fecha,bruto:mv.bruto||0,ret:mv.retencion||0,neto:(mv.bruto||0)-(mv.retencion||0)});
    } else if(mv.tipo==='liberadas'){
      /* Acciones totalmente liberadas (art. 37.1.a LIRPF): el coste se reparte entre antiguas y nuevas; antigüedad de las de origen */
      const tot=L.reduce((s,l)=>s+l.qty,0);
      if(tot<=1e-9) errores.push(`Acciones liberadas de ${mv.valor} del ${fmtD(mv.fecha)}: no tenías títulos de ese valor en esa fecha.`);
      else L.forEach(l=>{const add=mv.titulos*l.qty/tot; l.cpu=l.cpu*l.qty/(l.qty+add); l.qty+=add;});
    } else if(mv.tipo==='split'){
      const r=mv.antiguas>0&&mv.nuevas>0?mv.nuevas/mv.antiguas:(mv.ratio>0?mv.ratio:1);
      L.forEach(l=>{l.qty*=r; l.cpu/=r;});
    } else if(mv.tipo==='derechos'){
      /* Venta de derechos de valores cotizados: ganancia patrimonial íntegra desde 2017, con retención */
      comisiones += (mv.gastos||0);
      derechos.push({mov:mv,valor:mv.valor,fecha:mv.fecha,importe:(mv.bruto||0)-(mv.gastos||0),bruto:mv.bruto||0,gastos:mv.gastos||0,ret:mv.retencion||0});
    }
  });

  /* Regla de los dos meses (art. 33.5.f LIRPF), procedimiento DGT V0248-18 */
  ventas.forEach(v=>{
    if(v.gp >= -0.005 || v.qty<=0) return;
    const desde = addMonths(v.fecha,-2), hasta = v.ventanaHasta;
    const compras = comprasPorValor[v.valor]||[];
    let antes=0, despues=0;
    compras.forEach(c=>{
      if(c.idx<v.idx && c.fecha>=desde) antes+=c.qty;
      else if(c.idx>v.idx && c.fecha<=hasta) despues+=c.qty;
    });
    const recAntes = Math.min(antes, v.saldoTras);
    const rec = Math.min(v.qty, recAntes + despues);
    v.recompra = rec;
    v.noComputable = -v.gp * (rec/v.qty);
    v.ventanaAbierta = hasta >= hoy;
    /* La pérdida no computable queda ligada a los títulos recomprados y se integra cuando se vendan (art. 33.5.f LIRPF) */
    if(rec>1e-9){
      const porAcc=v.noComputable/rec; let capA=Math.min(recAntes,rec), rem=rec;
      const asignar=(c,q)=>{const d=difer[c.mid]=difer[c.mid]||{valor:v.valor,fecha:c.fecha,mid:c.mid,titulos:0,importe:0,restantes:0,desde:v.idx};
        d.titulos+=q; d.importe+=q*porAcc; d.restantes+=q; d.desde=Math.min(d.desde,v.idx); v.recompras.push({fecha:c.fecha,qty:q});};
      compras.filter(c=>c.idx<v.idx&&c.fecha>=desde).sort((a,b)=>b.idx-a.idx).forEach(c=>{
        if(capA<=1e-9) return; const libre=(v.quedan[c.mid]||0)-((difer[c.mid]||{}).titulos||0); const q=Math.min(capA,libre);
        if(q>1e-9){asignar(c,q);capA-=q;rem-=q;} });
      compras.filter(c=>c.idx>v.idx&&c.fecha<=hasta).sort((a,b)=>a.idx-b.idx).forEach(c=>{
        if(rem<=1e-9) return; const libre=c.qty-((difer[c.mid]||{}).titulos||0); const q=Math.min(rem,libre);
        if(q>1e-9){asignar(c,q);rem-=q;} });
    }
  });
  /* Integración de pérdidas aplazadas al vender los títulos recomprados */
  ventas.forEach(v=>{ v.usados.forEach(u=>{ const d=difer[u.mid]; if(!d||d.restantes<=1e-9||v.idx<=d.desde) return;
    const q=Math.min(u.qty,d.restantes); const imp=q*d.importe/d.titulos; d.restantes-=q; v.difInt+=imp; v.difDet.push({fecha:d.fecha,qty:q,importe:imp}); }); });
  const diferidas=Object.values(difer).filter(d=>d.restantes>1e-9).map(d=>({valor:d.valor,fecha:d.fecha,titulos:d.restantes,importe:d.restantes*d.importe/d.titulos}));

  /* Posiciones abiertas */
  const posiciones = [];
  Object.keys(lotes).sort().forEach(val=>{
    const L=lotes[val]; const qty=L.reduce((s,l)=>s+l.qty,0); if(qty<=1e-9) return;
    const coste=L.reduce((s,l)=>s+l.qty*l.cpu,0);
    const pe = precios[val]; const precio = pe? pe.p : NaN;
    const mercado = isFinite(precio)? qty*precio : NaN;
    const diasMedio = L.reduce((s,l)=>s+l.qty*l.cpu*days(l.fecha,hoy),0)/coste;
    const divVal = divs.filter(d=>d.valor===val).reduce((s,d)=>s+d.bruto,0);
    posiciones.push({valor:val,qty,coste,pm:coste/qty,precio,fechaPrecio:pe?pe.f:'',mercado,latente:mercado-coste,diasMedio,lotes:L.length,divVal});
  });

  /* Agregados */
  const realizado = ventas.reduce((s,v)=>s+v.gp,0) + derechos.reduce((s,d)=>s+d.importe,0);
  const latente = posiciones.reduce((s,p)=>s+(isFinite(p.latente)?p.latente:0),0);
  const sinPrecio = posiciones.filter(p=>!isFinite(p.precio)).map(p=>p.valor);
  const divBruto = divs.reduce((s,d)=>s+d.bruto,0), divRet = divs.reduce((s,d)=>s+d.ret,0);
  const totalCompras = ord.filter(m=>m.tipo==='compra').reduce((s,m)=>s+m.titulos*m.precio+(m.gastos||0),0);
  const costeVendido = ventas.reduce((s,v)=>s+v.adq,0);
  const costeVivo = posiciones.reduce((s,p)=>s+p.coste,0);
  const mercado = posiciones.reduce((s,p)=>s+(isFinite(p.mercado)?p.mercado:p.coste),0);
  const total = realizado + latente + divBruto;

  /* Periodo medio invertido (ponderado por coste): lotes cerrados hasta la venta, abiertos hasta hoy */
  let pesoD=0, pesoC=0;
  ventas.forEach(v=>{ v.usados.forEach(u=>{pesoD+=u.qty*u.cpu*days(u.fecha,v.fecha); pesoC+=u.qty*u.cpu;}); });
  posiciones.forEach(p=>{ pesoD+=p.diasMedio*p.coste; pesoC+=p.coste; });
  const diasMedio = pesoC>0? pesoD/pesoC : 0;

  /* Capital medio comprometido = coste·días / días del periodo */
  const primera = ord.length? ord[0].fecha : hoy;
  const span = Math.max(1, days(primera, hoy));
  const capitalMedio = pesoD/span;

  /* TIR (XIRR) de flujos: compras −, ventas +, dividendos brutos +, valor actual + */
  const flujos=[];
  ord.forEach(m=>{
    if(m.tipo==='compra') flujos.push([m.fecha,-(m.titulos*m.precio+(m.gastos||0))]);
    else if(m.tipo==='venta') flujos.push([m.fecha,m.titulos*m.precio-(m.gastos||0)]);
    else if(m.tipo==='dividendo') flujos.push([m.fecha,m.bruto||0]);
    else if(m.tipo==='derechos') flujos.push([m.fecha,(m.bruto||0)-(m.gastos||0)]);
  });
  if(mercado>0) flujos.push([hoy,mercado]);
  const tir = xirr(flujos);

  /* Por año fiscal */
  const anios = {};
  const A = y => anios[y] = anios[y] || {anio:y,ventas:[],divs:[],der:[],derImp:0,derRet:0,gan:0,per:0,noComp:0,difInt:0,divBruto:0,divRet:0};
  ventas.forEach(v=>{const a=A(v.fecha.slice(0,4)); a.ventas.push(v); if(v.gp>=0) a.gan+=v.gp; else {a.per+=v.gp+v.noComputable; a.noComp+=v.noComputable;} if(v.difInt>0){a.per-=v.difInt; a.difInt+=v.difInt;}});
  divs.forEach(d=>{const a=A(d.fecha.slice(0,4)); a.divs.push(d); a.divBruto+=d.bruto; a.divRet+=d.ret;});
  derechos.forEach(d=>{const a=A(d.fecha.slice(0,4)); a.der.push(d); a.derImp+=d.importe; a.derRet+=d.ret; if(d.importe>=0) a.gan+=d.importe; else a.per+=d.importe;});
  /* Arrastre de saldos negativos de G/P de los 4 ejercicios anteriores (art. 49 LIRPF), del más antiguo al más reciente */
  let arrastre = []; // [{anio, importe}]
  Object.keys(anios).sort().forEach(y=>{
    const a=anios[y];
    arrastre = arrastre.filter(x=>Number(y)-Number(x.anio)<=4 && x.importe>0.005);
    a.saldoGP = a.gan + a.per;
    let gp=a.saldoGP, rcm=a.divBruto, compensa=0, arrUsado=0;
    // 1) Pérdidas de años anteriores contra el saldo positivo de G/P
    for(const x of arrastre){ if(gp<=0) break; const u=Math.min(x.importe,gp); x.importe-=u; gp-=u; arrUsado+=u; }
    // 2) Pérdidas de años anteriores contra hasta el 25 % de los dividendos
    let limite=.25*rcm;
    for(const x of arrastre){ if(limite<=0) break; const u=Math.min(x.importe,limite); x.importe-=u; limite-=u; rcm-=u; arrUsado+=u; }
    // 3) Saldo negativo del propio año contra el 25 % restante de dividendos
    let pendiente=0;
    if(gp<0){ compensa=Math.min(-gp, Math.max(0,limite)); rcm-=compensa; pendiente=-gp-compensa; gp=0; }
    a.arrUsado=arrUsado; a.compensa=compensa; a.pendiente=pendiente;
    a.base=Math.max(0,gp)+rcm; a.cuota=cuotaAhorro(a.base); a.resultado=a.cuota-a.divRet-a.derRet;
    arrastre = arrastre.filter(x=>x.importe>0.005);
    if(pendiente>0.005) arrastre.push({anio:y,importe:pendiente});
    a.arrastreSiguiente = arrastre.reduce((s,x)=>s+x.importe,0);
  });

  return {derechos,diferidas,ord,ventas,divs,posiciones,errores,realizado,latente,sinPrecio,divBruto,divRet,totalCompras,costeVendido,costeVivo,mercado,total,diasMedio,capitalMedio,tir,anios,comisiones,primera};
}

function xirr(fl){
  if(fl.length<2) return NaN;
  if(!fl.some(f=>f[1]<0)||!fl.some(f=>f[1]>0)) return NaN;
  const t0=parseD(fl[0][0]);
  const ts=fl.map(f=>(parseD(f[0])-t0)/(365*86400000));
  if(Math.max(...ts)<1/365) return NaN;
  const f=r=>fl.reduce((s,x,i)=>s+x[1]/Math.pow(1+r,ts[i]),0);
  let lo=-0.9999, hi=10, flo=f(lo), fhi=f(hi);
  if(flo*fhi>0) return NaN;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}

/* ---------- Precios desde una hoja de Google publicada como CSV ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function numCSV(s){ if(s==null) return NaN; let t=String(s).trim().replace(/[€%\s]/g,''); if(!t) return NaN;
  if(t.includes(',')&&t.includes('.')){ t = t.lastIndexOf(',')>t.lastIndexOf('.') ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,''); }
  else if(t.includes(',')) t=t.replace(',','.');
  return Number(t); }
async function actualizarPrecios(silencioso){
  if(!ajustes.csvUrl || cargandoPrecios) return;
  cargandoPrecios=true; errPrecios=''; if(!silencioso) render();
  try{
    const r=await fetch(ajustes.csvUrl+(ajustes.csvUrl.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('La hoja respondió con error '+r.status+'.');
    const filas=parseCSV(await r.text());
    const hoy=todayStr(), hora=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    let n=0;
    filas.forEach(f=>{
      const t=(f[0]||'').trim().toUpperCase().replace(/^BME:/,''); const p=numCSV(f[1]); const v=numCSV(f[2]);
      if(!t || !(p>0)) return;
      state.precios[t]={p,f:hoy,h:hora,v:isFinite(v)?v:null}; n++;
    });
    if(!n) throw new Error('No se encontró ningún precio. Revisa que la columna A tenga el valor y la B el precio.');
    ajustes.ultimaAct=new Date().toISOString(); guardarAjustes(); guardar(); registrarHistorial();
    if(!silencioso) toast(n+' precios actualizados');
  }catch(e){
    errPrecios = (e && e.name==='TypeError') ? 'No se pudo conectar con la hoja. Comprueba la conexión y que el enlace sea el de "Publicar en la web" en formato CSV.' : (e.message||'Error al leer la hoja.');
    if(!silencioso) toast('No se pudieron actualizar los precios');
  }
  cargandoPrecios=false; render();
}

function renderBanner(){
  const b=$('banner');
  if(modo==='cargando'){b.innerHTML='';return;}
  if(demo){
    b.innerHTML=`<div class="banner demo"><p><span class="chip demo">Ejemplo</span> Estás viendo una cartera inventada para que veas cómo funciona. Sus precios no son cotizaciones reales. Al registrar tu primer movimiento, los ejemplos se borran. Si ya usabas la versión de Claude, restaura tu copia desde Ajustes.</p><button class="btn" id="bEmpezar">Empezar con mi cartera</button></div>`;
    $('bEmpezar').onclick=empezar;
  } else {
    const dias = ajustes.ultimaCopia? days(ajustes.ultimaCopia.slice(0,10),todayStr()) : Infinity;
    b.innerHTML = (state.movs.length && dias>30) ? `<div class="banner"><p>${ajustes.ultimaCopia?'Tu última copia de seguridad es de hace '+dias+' días.':'Aún no has hecho ninguna copia de seguridad.'} Tus datos solo están en este dispositivo.</p><button class="btn ghost" id="bCopia">Hacer copia</button></div>` : '';
    const bc=$('bCopia'); if(bc) bc.onclick=()=>{tab='copia';render();};
  }
}

function kpi(t,v,s,c){return `<div class="kpi"><h3>${t}</h3><div class="v ${c||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}

function renderResumen(R,hoy){
  const el=$('v-resumen');
  if(!state.movs.length){el.innerHTML=`<div class="panel empty">Aún no hay movimientos. Ve a <b>Movimientos</b> y registra tu primera compra.</div>`;return;}
  const pctTotal = R.totalCompras>0? R.total/R.totalCompras : NaN;
  const pctCapMedio = R.capitalMedio>0? R.total/R.capitalMedio : NaN;
  const alerts=[];
  R.errores.forEach(e=>alerts.push(`<li><b>Revisa:</b> ${esc(e)}</li>`));
  R.ventas.filter(v=>v.noComputable>0.005).forEach(v=>alerts.push(`<li><b>Regla de los dos meses · ${esc(v.valor)}</b> — venta con pérdida del ${fmtD(v.fecha)}: ${NUM.format(v.recompra)} de ${NUM.format(v.qty)} títulos se consideran recomprados. ${eur(v.noComputable)} de pérdida no se pueden computar ahora; se aplicarán automáticamente en el año en que vendas esos títulos.</li>`));
  R.ventas.filter(v=>v.gp<-0.005 && v.ventanaAbierta && v.noComputable < -v.gp-0.005).forEach(v=>alerts.push(`<li><b>Ventana abierta · ${esc(v.valor)}</b> — si compras ${esc(v.valor)} antes del ${fmtD(v.ventanaHasta)}, parte de la pérdida del ${fmtD(v.fecha)} (${eur(-v.gp)}) dejará de ser computable este año.</li>`));
  avisosObjetivos().forEach(x=>alerts.push(x));
  avisosConcentracion(R).forEach(x=>alerts.push(x));
  const proxDiv=proximosDividendos(hoy);
  proxDiv.filter(d=>R.posiciones.some(p=>p.valor===d.t)).forEach(d=>{const p=R.posiciones.find(x=>x.valor===d.t); alerts.push(`<li class="info"><b>Dividendo próximo · ${esc(nombre(d.t)||d.t)}</b> — ${esc(textoFecha(d))}${d.imp?`, ${EUR40.format(d.imp)} €/acción: cobrarías unos ${eur(p.qty*d.imp)} brutos`:''}${d.estado!=='confirmado'?' (estimado)':''}.</li>`);});
  if(proxDiv.length) alerts.push(`<li class="info">${proxDiv.length} empresas del IBEX tienen dividendo previsto en los próximos 3 meses. Míralos en <b>Mercado</b>.</li>`);
  const viejos = R.posiciones.filter(p=>p.fechaPrecio && days(p.fechaPrecio,hoy)>7).map(p=>p.valor);
  if(R.sinPrecio.length) alerts.push(`<li class="info">Sin precio actual para ${R.sinPrecio.map(esc).join(', ')}: se valora a coste. Actualízalo en <b>Cartera</b> o conecta los precios automáticos en <b>Ajustes</b>.</li>`);
  if(viejos.length) alerts.push(`<li class="info">Precios con más de una semana: ${viejos.map(esc).join(', ')}.</li>`);

  const porValor = {};
  const pv = v => porValor[v] = porValor[v] || {r:0,l:0,d:0,abierta:false};
  R.ventas.forEach(v=>{pv(v.valor).r+=v.gp;});
  R.posiciones.forEach(p=>{const o=pv(p.valor);o.abierta=true;o.l+=(isFinite(p.latente)?p.latente:0);});
  R.divs.forEach(d=>{pv(d.valor).d+=d.bruto;});
  const filas = Object.entries(porValor).map(([v,o])=>[v,o.r+o.l+o.d,o]).sort((a,b)=>b[1]-a[1]);
  const maxAbs = Math.max(1,...filas.map(f=>Math.abs(f[1])));
  const P = R.posiciones, Pp = P.filter(p=>isFinite(p.mercado));
  const cvCoste = Pp.reduce((s,p)=>s+p.coste,0), cvValor = Pp.reduce((s,p)=>s+p.mercado,0), cvLat = cvValor-cvCoste;
  const cvMax = Math.max(1,...P.map(p=>Math.max(p.coste, isFinite(p.mercado)?p.mercado:0)));
  const recup = p => { if(!isFinite(p.precio)) return 'sin precio actual: introdúcelo en Cartera';
    const base = 'precio medio '+eur(p.pm)+' · actual '+eur(p.precio);
    if(oculto) return base;
    return p.precio < p.pm ? base+' · necesita subir '+pct(p.pm/p.precio-1).replace('+','')+' para recuperar' : base+' · margen '+pct(1-p.pm/p.precio).replace('+','')+' sobre tu precio medio'; };
  const cartActual = !P.length ? `<div class="panel"><h2>Cartera actual</h2><p class="note">No tienes posiciones abiertas ahora mismo.</p></div>` : `
  <div class="panel">
    <div class="cv-head"><h2>Cartera actual</h2>${Pp.length?`<span class="chip ${cvLat>=0?'gan':'per'}">${cvLat>=0?'En beneficio':'En pérdida'}</span>`:''}</div>
    <div class="cv-sum">
      <div><span class="k">Pagaste</span><span class="v">${eur(cvCoste)}</span><span class="s muted">con comisiones</span></div>
      <div><span class="k">Vale hoy</span><span class="v">${eur(cvValor)}</span><span class="s muted">${P.length} valor${P.length===1?'':'es'}</span></div>
      <div><span class="k">${oculto?'Resultado':cvLat>=0?'Ganas':'Pierdes'}</span><span class="v ${cls(cvLat)}">${sgn(cvLat)}</span><span class="s ${cls(cvLat)}">${cvCoste?pct(cvLat/cvCoste):'—'}</span></div>
    </div>
    <div class="cv-leg" aria-hidden="true"><span><i style="background:var(--muted)"></i>Lo que pagaste</span><span><i style="background:var(--gain)"></i>Vale hoy (beneficio)</span><span><i style="background:var(--loss)"></i>Vale hoy (pérdida)</span></div>
    <div class="cv-list">${P.map(p=>{const ok=isFinite(p.mercado);return `<div class="cv-row">
      <span class="num"><b>${esc(p.valor)}</b></span>
      <div class="cv-bars" role="img" aria-label="${esc(p.valor)}: pagaste ${eur(p.coste)}, vale ${ok?eur(p.mercado):'sin precio'}"><div class="t"><div class="f coste" style="width:${(p.coste/cvMax*100).toFixed(1)}%"></div></div><div class="t">${ok?`<div class="f ${p.latente>=0?'g':'p'}" style="width:${(p.mercado/cvMax*100).toFixed(1)}%"></div>`:''}</div></div>
      <span class="val ${cls(p.latente)}">${ok?sgn(p.latente)+'<br>'+pct(p.latente/p.coste):'—'}</span>
      <span class="det">${recup(p)}${p.fechaPrecio?' · precio del '+fmtD(p.fechaPrecio):''}</span></div>`;}).join('')}</div>
    ${R.sinPrecio.length?`<p class="note">Sin precio: ${R.sinPrecio.map(esc).join(', ')}. No se incluye${R.sinPrecio.length>1?'n':''} en el total.</p>`:''}
  </div>`;
  const ganan = filas.filter(f=>f[1]>0.005), pierden = filas.filter(f=>f[1]<-0.005);
  const totG = ganan.reduce((s,f)=>s+f[1],0), totP = pierden.reduce((s,f)=>s+f[1],0);
  const detalle = o => [Math.abs(o.r)>0.005?'ventas '+sgn(o.r):'', Math.abs(o.l)>0.005||o.abierta?'latente '+sgn(o.l):'', o.d>0.005?'dividendos '+sgn(o.d):''].filter(Boolean).join(' · ');

  el.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
  <div class="hero">
    <div><h3>Valor de la cartera</h3><div class="big">${eur(R.mercado)}</div><div class="muted" style="font-size:.8rem">${R.sinPrecio.length? 'algunos valores a coste, sin precio':'con los precios que has introducido'}</div></div>
    <div style="text-align:right"><h3>Beneficio total</h3><div class="sub ${cls(R.total)}" style="font-size:1.25rem">${sgn(R.total)}</div><div class="sub ${cls(R.total)}">${pct(pctTotal)} s/ compras</div></div>
  </div>
  <div class="kpis">
    ${kpi('Latente', sgn(R.latente), R.costeVivo? pct(R.latente/R.costeVivo)+' s/ coste vivo':'', cls(R.latente))}
    ${kpi('Realizado', sgn(R.realizado), 'ventas cerradas', cls(R.realizado))}
    ${kpi('Rentab. s/ capital medio', pct(pctCapMedio), 'capital medio '+eur(R.capitalMedio), cls(R.total))}
    ${kpi('TIR anualizada', isFinite(R.tir)? pct(R.tir):'—', 'con flujos y fechas reales', cls(R.tir))}
    ${kpi('Periodo medio invertido', fmtDays(R.diasMedio), Math.round(R.diasMedio)+' días, ponderado por coste')}
    ${kpi('Dividendos netos', eur(R.divBruto-R.divRet), 'brutos '+eur(R.divBruto))}
  </div>
  ${alerts.length?`<ul class="alerts">${alerts.join('')}</ul>`:''}
  ${cartActual}
  ${panelEvolucion()}
  <div class="grid2">
    <div class="panel">
      <h2>De dónde sale el beneficio</h2>
      <dl class="rows">
        <dt>Ganancias y pérdidas realizadas (ventas)</dt><dd class="${cls(R.realizado)}">${sgn(R.realizado)}</dd>
        <dt>Plusvalía latente (cartera viva)</dt><dd class="${cls(R.latente)}">${sgn(R.latente)}</dd>
        <dt>Dividendos brutos cobrados</dt><dd class="${cls(R.divBruto)}">${sgn(R.divBruto)}</dd>
        <dt class="total">Beneficio total antes de impuestos</dt><dd class="total ${cls(R.total)}">${sgn(R.total)}</dd>
        <dt>Retenciones soportadas en dividendos</dt><dd>${eur(R.divRet)}</dd>
        <dt>Comisiones pagadas (ya descontadas arriba)</dt><dd>${eur(R.comisiones)}</dd>
        <dt>Total invertido en compras</dt><dd>${eur(R.totalCompras)}</dd>
        <dt>Coste de lo que sigues teniendo</dt><dd>${eur(R.costeVivo)}</dd>
      </dl>
    </div>
    <div class="panel">
      <h2>Ganancias y pérdidas por valor</h2>
      <div class="gl-sum">
        <div><span class="k">Ganancias · ${ganan.length} valor${ganan.length===1?'':'es'}</span><span class="v pos">${sgn(totG)}</span></div>
        <div><span class="k">Pérdidas · ${pierden.length} valor${pierden.length===1?'':'es'}</span><span class="v ${totP<-0.005?'neg':''}">${totP<-0.005?sgn(totP):eur(0)}</span></div>
      </div>
      <div class="dbar-axis" aria-hidden="true"><span></span><div><span>← pérdida</span><span>0</span><span>ganancia →</span></div><span></span></div>
      <div class="dbars">${filas.map(([v,x,o])=>{const w=(Math.abs(x)/maxAbs*100).toFixed(1);return `<div class="dbar"><span class="num"><b>${esc(v)}</b></span><div class="track" role="img" aria-label="${esc(v)}: ${sgn(x)}"><div class="half l">${x<0?`<div class="fill p" style="width:${w}%"></div>`:''}</div><div class="half r">${x>0?`<div class="fill g" style="width:${w}%"></div>`:''}</div></div><span class="num val ${cls(x)}">${sgn(x)}</span><span class="det">${detalle(o)}</span></div>`;}).join('')}</div>
      <p class="note">Resultado de cada valor sumando ventas cerradas, plusvalía o minusvalía latente de lo que sigues teniendo y dividendos brutos. Neto de todos: <b class="${cls(totG+totP)}">${sgn(totG+totP)}</b>.</p>
    </div>
  </div>
  <details class="panel"><summary><b>Cómo se calcula cada cifra</b></summary>
    <ul class="note-list">
      <li><b>Beneficio total</b>: ventas (con criterio FIFO y comisiones) + plusvalía latente al precio que introduces + dividendos brutos.</li>
      <li><b>% s/ compras</b>: beneficio total entre todo lo que has pagado en compras. Es sencillo, pero infravalora si reinviertes el dinero de las ventas.</li>
      <li><b>Rentabilidad s/ capital medio</b>: beneficio total entre el dinero que, de media, has tenido invertido desde tu primera compra (${fmtD(R.primera)}). No está anualizada.</li>
      <li><b>TIR</b>: rentabilidad anual equivalente que tiene en cuenta cuándo entró y salió cada euro. Con menos de un año de historial puede salir extrema; tómala con cautela.</li>
      <li><b>Periodo medio invertido</b>: días que ha estado invertido cada euro de coste, de media. Lo vendido cuenta hasta la venta y lo vivo hasta hoy.</li>
    </ul>
  </details>
  </div>`;
}

function renderMovs(R){
  const el=$('v-movimientos');
  const editando = editId? state.movs.find(m=>m.id===editId) : null;
  const t = editando? editando.tipo : tipoForm;
  const m = editando || prefill || {};
  const anios=[...new Set(state.movs.map(x=>x.fecha.slice(0,4)))].sort().reverse();
  const valoresUsados=[...new Set(state.movs.map(x=>x.valor))].sort();
  let lista = R.ord.slice().reverse();
  if(filtroValor) lista=lista.filter(x=>x.valor===filtroValor);
  if(filtroAnio) lista=lista.filter(x=>x.fecha.startsWith(filtroAnio));
  const ventaMap = new Map(R.ventas.map(v=>[v.mov.id,v]));
  const v = (x)=> x==null||x===''||(typeof x==='number'&&isNaN(x))? '' : String(x).replace('.',',');

  el.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
  <div class="panel">
    <div class="toolbar"><h2>${editando?'Editar movimiento':'Nuevo movimiento'}</h2>
      ${editando?'':`<div class="seg" role="group" aria-label="Tipo">${['compra','venta','dividendo','otras'].map(k=>`<button type="button" data-tipo="${k}" aria-pressed="${t===k||(k==='otras'&&ESPECIALES.includes(t))}">${k==='otras'?'Otras':k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`}
    </div>
    ${ESPECIALES.includes(t)&&!editando?`<label class="esp-sel">Tipo de operación<select id="fEsp">${ESPECIALES.map(k=>`<option value="${k}" ${k===t?'selected':''}>${TIPO_TXT[k]}</option>`).join('')}</select></label>`:''}
    <form class="mov" id="fMov" novalidate>
      <label>Fecha<input type="date" id="fFecha" required value="${esc(m.fecha||todayStr())}"></label>
      <label>Valor (ticker)<input id="fValor" list="valores" required autocomplete="off" placeholder="SAN" value="${esc(m.valor||'')}"></label>
      ${t==='liberadas' ? `
        <label>Acciones recibidas<input class="numin" id="fTit" inputmode="decimal" placeholder="12" value="${v(m.titulos)}"></label>
        <p class="hint">Acciones gratuitas de un <b>dividendo flexible (scrip)</b> o ampliación liberada. No tributan al recibirlas: el coste de tus acciones se reparte entre las antiguas y las nuevas, que heredan su antigüedad (art. 37.1.a LIRPF). Si en vez de acciones vendiste los derechos a la propia empresa a precio fijo, regístralo como <b>Dividendo</b>; si los vendiste en bolsa, como <b>Venta de derechos</b>.</p>
      ` : t==='derechos' ? `
        <label>Importe bruto de la venta (€)<input class="numin" id="fBruto" inputmode="decimal" placeholder="25,00" value="${v(m.bruto)}"></label>
        <label>Comisiones y gastos (€)<input class="numin" id="fGastos" inputmode="decimal" placeholder="0,00" value="${v(m.gastos)}"></label>
        <label>Retención (€)<input class="numin" id="fRet" inputmode="decimal" placeholder="19 % si lo dejas vacío" value="${v(m.retencion)}"></label>
        <p class="hint">Venta de <b>derechos de suscripción o de asignación gratuita en bolsa</b>: desde 2017 tributa entera como ganancia patrimonial del año en que vendes, con retención del 19 %. Si los vendiste a la propia empresa a precio fijo (opción habitual del scrip), regístralo como <b>Dividendo</b>.</p>
      ` : t==='split' ? `
        <label>Acciones nuevas<input class="numin" id="fNue" inputmode="decimal" placeholder="2" value="${v(m.nuevas)}"></label>
        <label>Por cada (antiguas)<input class="numin" id="fAnt" inputmode="decimal" placeholder="1" value="${v(m.antiguas)}"></label>
        <p class="hint"><b>Split</b> (por ejemplo 2 nuevas por cada 1) o <b>contrasplit</b> (1 nueva por cada 10). Cambia el número de acciones y su coste unitario, pero no tu coste total ni la antigüedad. No tributa.</p>
      ` : t==='dividendo' ? `
        <label>Importe bruto (€)<input class="numin" id="fBruto" inputmode="decimal" placeholder="115,00" value="${v(m.bruto)}"></label>
        <label>Retención (€)<input class="numin" id="fRet" inputmode="decimal" placeholder="19 % si lo dejas vacío" value="${v(m.retencion)}"></label>
      ` : `
        <label>Títulos<input class="numin" id="fTit" inputmode="decimal" placeholder="100" value="${v(m.titulos)}"></label>
        <label>Precio por acción (€)<input class="numin" id="fPrecio" inputmode="decimal" placeholder="6,85" value="${v(m.precio)}"></label>
        <label>Comisiones y gastos (€)<input class="numin" id="fGastos" inputmode="decimal" placeholder="0,00" value="${v(m.gastos)}"></label>
      `}
      ${store.carteras.length>1?`<label>Cartera<select id="fCart">${store.carteras.map(c=>`<option value="${esc(c.id)}" ${c.id===cartDefault(editando)?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></label>`:''}
      <label>ISIN (opcional)<input id="fIsin" autocomplete="off" placeholder="ES0113900J37" value="${esc(m.isin||'')}"></label>
      <label>Nota (opcional)<input id="fNota" autocomplete="off" value="${esc(m.nota||'')}"></label>
      <div class="preview" id="fPrev"></div>
      <div class="err-msg" id="fErr" hidden></div>
      <div class="actions" style="grid-column:1/-1">
        <button class="btn" type="submit">${editando?'Guardar cambios':'Añadir '+TIPO_TXT[t].toLowerCase()}</button>
        ${editando?'<button class="btn ghost" type="button" id="fCancel">Cancelar</button>':''}
      </div>
    </form>
  </div>

  <div class="toolbar">
    <h2>Historial <span class="muted" style="font-weight:400;font-size:.9rem">(${lista.length})</span></h2>
    <div class="actions">
      <label>Valor<select id="flV"><option value="">Todos</option>${valoresUsados.map(x=>`<option ${x===filtroValor?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
      <label>Año<select id="flA"><option value="">Todos</option>${anios.map(x=>`<option ${x===filtroAnio?'selected':''}>${x}</option>`).join('')}</select></label>
    </div>
  </div>
  ${borrarId?`<div class="confirm"><span>¿Eliminar este movimiento? No se puede deshacer.</span><button class="btn danger small" id="cSi">Eliminar</button><button class="btn ghost small" id="cNo">Cancelar</button></div>`:''}
  <div class="cards mob">${lista.length? lista.map(x=>{
      const vt=ventaMap.get(x.id);
      const {imp,det,res}=infoMov(x,vt);
      return `<div class="card"${borrarId===x.id?' style="background:var(--loss-soft)"':''}>
        <div><b>${esc(x.valor)}</b>${nombre(x.valor)?` <span class="muted" style="font-size:.82rem">${esc(nombre(x.valor))}</span>`:''} <span class="chip ${x.tipo}">${TIPO_CORTO[x.tipo]||x.tipo}</span>${demo?' <span class="chip demo">ej.</span>':''}<div class="meta">${fmtD(x.fecha)}</div></div>
        <div class="r"><div class="${cls(imp)}">${sgn(imp)}</div>${res?`<div style="font-size:.85rem">${res}</div>`:''}</div>
        <div class="full meta">${det}${x.nota?' · '+esc(x.nota):''}</div>
        <div class="full actions" style="justify-content:flex-end"><button class="btn ghost small" data-ed="${esc(x.id)}">Editar</button><button class="btn ghost small" data-del="${esc(x.id)}">Eliminar</button></div>
      </div>`;}).join('') : `<div class="panel empty">No hay movimientos con estos filtros.</div>`}</div>
  <div class="tbl desk"><table>
    <thead><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th class="n">Títulos</th><th class="n">Precio</th><th class="n">Gastos</th><th class="n">Importe</th><th class="n">Resultado</th><th></th></tr></thead>
    <tbody>${lista.length? lista.map(x=>{
      const vt=ventaMap.get(x.id);
      const {imp,res}=infoMov(x,vt);
      const sinTP=['dividendo','derechos','split'].includes(x.tipo);
      return `<tr${borrarId===x.id?' style="background:var(--loss-soft)"':''}>
        <td class="n">${fmtD(x.fecha)}</td><td><span class="chip ${x.tipo}">${TIPO_CORTO[x.tipo]||x.tipo}</span>${demo?' <span class="chip demo">ej.</span>':''}</td>
        <td><b>${esc(x.valor)}</b>${nombre(x.valor)?`<div class="muted" style="font-size:.78rem">${esc(nombre(x.valor))}</div>`:''}${x.nota?`<div class="muted" style="font-size:.78rem;white-space:normal;max-width:220px">${esc(x.nota)}</div>`:''}</td>
        <td class="n">${x.tipo==='split'?NUM.format(x.nuevas)+':'+NUM.format(x.antiguas):sinTP?'':NUM.format(x.titulos)}</td>
        <td class="n">${sinTP||x.tipo==='liberadas'?'':EUR4.format(x.precio)}</td>
        <td class="n">${x.tipo==='dividendo'?eur(x.retencion||0)+' ret.':x.tipo==='derechos'?eur(x.gastos||0)+' · '+eur(x.retencion||0)+' ret.':eur(x.gastos||0)}</td>
        <td class="n ${cls(imp)}">${sgn(imp)}</td><td class="n">${res}</td>
        <td><div class="actions" style="flex-wrap:nowrap"><button class="btn ghost small" data-ed="${esc(x.id)}">Editar</button><button class="btn ghost small" data-del="${esc(x.id)}">Eliminar</button></div></td></tr>`;}).join('') : `<tr><td colspan="9" class="empty">No hay movimientos con estos filtros.</td></tr>`}
    </tbody></table></div>
  </div>`;

  if(borrarId){$('cSi').onclick=()=>{
      if(demo){empezarSilencioso();}
      else {store.movs=store.movs.filter(x=>x.id!==borrarId);guardar();}
      borrarId=null;render();toast('Movimiento eliminado');};
    $('cNo').onclick=()=>{borrarId=null;render();};}
  if(editando) $('fCancel').onclick=()=>{editId=null;render();};

  const prev=()=>{
    const p=$('fPrev'); if(!p) return;
    if(t==='liberadas'||t==='split'){p.textContent='';return;}
    if(t==='derechos'){const b=toNum($('fBruto').value),g=toNum($('fGastos').value)||0;let r=toNum($('fRet').value);if(isNaN(r)&&isFinite(b))r=r2(b*.19);p.textContent=isFinite(b)?`Ganancia patrimonial: ${eur(b-g)} · neto en cuenta: ${eur(b-g-(isFinite(r)?r:0))}`:'';return;}
    if(t==='dividendo'){const b=toNum($('fBruto').value);let r=toNum($('fRet').value);if(isNaN(r)&&isFinite(b))r=r2(b*.19);p.textContent=isFinite(b)?`Neto cobrado: ${eur(b-(isFinite(r)?r:0))} · retención ${eur(isFinite(r)?r:0)}`:'';}
    else{const q=toNum($('fTit').value),pr=toNum($('fPrecio').value),g=toNum($('fGastos').value)||0;if(isFinite(q)&&isFinite(pr))p.textContent=t==='compra'?`Coste total: ${eur(q*pr+g)} · coste por acción con gastos: ${EUR4.format((q*pr+g)/q)} €`:`Importe neto de la venta: ${eur(q*pr-g)}`;else p.textContent='';}
  };

    e.preventDefault();

    const fail=t=>{err.textContent=t;err.hidden=false;};
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return fail('Indica la fecha del movimiento.');
    if(!valor) return fail('Indica el valor, por ejemplo SAN o ITX.');
    const o={tipo:t,fecha,valor,isin:$('fIsin').value.trim().toUpperCase(),nota:$('fNota').value.trim(),cartera:($('fCart')&&carteraDe($('fCart').value))?$('fCart').value:cartDefault(editando)};

    } else if(t==='derechos'){
      o.bruto=toNum($('fBruto').value); if(!(o.bruto>0)) return fail('Indica el importe bruto de la venta de derechos.');
      o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos)) o.gastos=0;
      const r=toNum($('fRet').value); o.retencion=isNaN(r)?r2(o.bruto*.19):r;
      if(o.retencion<0||o.retencion>o.bruto) return fail('La retención debe estar entre 0 y el importe bruto.');
      o.titulos=0;o.precio=0;
    } else if(t==='dividendo'){
      o.bruto=toNum($('fBruto').value); if(!(o.bruto>0)) return fail('Indica el importe bruto del dividendo (antes de retención).');
      const r=toNum($('fRet').value); o.retencion = isNaN(r)? r2(o.bruto*.19) : r;
      if(o.retencion<0||o.retencion>o.bruto) return fail('La retención debe estar entre 0 y el importe bruto.');
      o.titulos=0;o.precio=0;o.gastos=0;
    } else {
      o.titulos=toNum($('fTit').value); o.precio=toNum($('fPrecio').value); o.gastos=toNum($('fGastos').value); if(isNaN(o.gastos))o.gastos=0;
      if(!(o.titulos>0)) return fail('Indica cuántos títulos.');
      if(!(o.precio>0)) return fail('Indica el precio por acción.');
      if(o.gastos<0) return fail('Las comisiones no pueden ser negativas.');
      o.bruto=0;o.retencion=0;
    }
    if(demo) empezarSilencioso();
    if(editando && !demo){Object.assign(state.movs.find(x=>x.id===editId),o);editId=null;toast('Cambios guardados');}
    else {const seq=Math.max(0,...store.movs.map(x=>x.seq||0))+1; store.movs.push(Object.assign({id:uid(),seq},o)); toast(TIPO_TXT[t]+' añadida');}
    editId=null; prefill=null;
    guardar(); render();
  };

function cargarXLSX(){

    }

  const fmtMov={0:FD,4:FN,5:'#,##0.0000 "€"',6:FE,7:FE,8:FE,9:FE,10:FN,11:FE,12:FE};
  const anchoMov=[11,10,8,26,9,11,10,13,12,15,12,15,15,36,18];
  const saldos={}; const todas=R.ord.map(m=>{if(m.tipo==='compra'||m.tipo==='liberadas')saldos[m.valor]=(saldos[m.valor]||0)+m.titulos;else if(m.tipo==='venta')saldos[m.valor]=(saldos[m.valor]||0)-m.titulos;else if(m.tipo==='split'&&m.antiguas>0)saldos[m.valor]=(saldos[m.valor]||0)*m.nuevas/m.antiguas;return filaMov(m,m.tipo==='dividendo'||m.tipo==='derechos'?'':Math.round((saldos[m.valor]||0)*10000)/10000);});
  hoja('Todos los movimientos',cabMov,todas,fmtMov,anchoMov,{6:1,7:1,8:1,9:1,11:1,12:1},
    ['Importe en cuenta: compras en negativo (precio × títulos + gastos), ventas en positivo (precio × títulos − gastos), dividendos netos de retención.',AVISO]);

  /* 6. Una pestaña por acción */
  const valores=[...new Set(R.ord.map(m=>m.valor))].sort((a,b)=>(nombre(a)||a).localeCompare(nombre(b)||b,'es'));
  valores.forEach(t=>{
    const filas=todas.filter(f=>f[2]===t);
    const pos=R.posiciones.find(p=>p.valor===t);
    const real=R.ventas.filter(v=>v.valor===t).reduce((s,v)=>s+v.gp,0);
    const div=R.divs.filter(d=>d.valor===t).reduce((s,d)=>s+d.bruto,0);
    const pie=[
      `Resumen ${nombre(t)||t} (${t}) · generado el ${fmtD(hoy)}`,
      `Ganancia/pérdida realizada en ventas: ${EUR.format(real)} · Dividendos brutos: ${EUR.format(div)}`,
      pos?`Posición abierta: ${NUM.format(pos.qty)} títulos · coste ${EUR.format(pos.coste)}${isFinite(pos.latente)?' · latente '+EUR.format(pos.latente)+' al precio de '+EUR4.format(pos.precio)+' €':' · sin precio actual'}`:'Sin posición abierta.',
      `Resultado total del valor (ventas + dividendos${pos&&isFinite(pos.latente)?' + latente':''}): ${EUR.format(real+div+(pos&&isFinite(pos.latente)?pos.latente:0))}`];
    hoja(`${t} - ${corto(t)}`,cabMov,filas,fmtMov,anchoMov,{6:1,7:1,8:1,9:1,11:1,12:1},pie);
  });
  wb.Props={Title:'Cartera de Inversiones · Informe fiscal',Author:'Cartera de Inversiones',CreatedDate:new Date()};
  return wb;
}

async function exportarExcel(modo){
  const msg=$('xlsMsg'); if(!msg) return;
  if(demo||!movsFiscales().length){msg.textContent='Primero registra tus movimientos: con los datos de ejemplo no se genera el Excel.';return;}
  msg.textContent='Generando el Excel…';
  try{
    const X=await cargarXLSX(); const hoy=todayStr();
    const wb=construirExcel(X,calcular(movsFiscales(),store.precios,hoy),hoy);
    const buf=X.write(wb,{bookType:'xlsx',type:'array',compression:true});
    const fn='cartera-inversiones-fiscal-'+(grupoFiscal().nombre.normalize('NFD').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,30)||'cartera')+'-'+hoy+'.xlsx', tipo='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const blob=new Blob([buf],{type:tipo});
    if(modo==='compartir'){ await navigator.share({files:[new File([blob],fn,{type:tipo})],title:'Cartera de Inversiones · Informe fiscal'}); msg.textContent='Excel listo: '+fn; return; }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    msg.textContent='Excel descargado: '+fn; toast('Excel descargado');
  }catch(e){ if(e&&e.name==='AbortError'){msg.textContent='';return;} msg.textContent=(e&&e.message)||'No se pudo generar el Excel.'; }
}
function botonesExcel(){
  let comp=false; try{comp=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})]}));}catch(e){}
  return (comp?'<button class="btn" id="xlsSh">Compartir Excel…</button>':'')+`<button class="btn ${comp?'ghost':''}" id="xlsDl">Descargar Excel</button>`;
}

function toCSV(){
  const head=['fecha','tipo','valor','isin','titulos','precio','gastos','bruto','retencion','nota','cartera'];
  const q=s=>{s=String(s??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const nf=n=>n?String(n).replace('.',','):'';
  return '﻿'+head.join(';')+'\n'+ordenar(state.movs).map(m=>[m.fecha,m.tipo,m.valor,m.isin,nf(m.titulos),nf(m.precio),nf(m.gastos),nf(m.bruto),nf(m.retencion),m.nota,(carteraDe(m.cartera)||{}).nombre||''].map(q).join(';')).join('\n');
}

function renderCopia(){
  const el=$('v-copia');
  const ult = ajustes.ultimaCopia? new Date(ajustes.ultimaCopia).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}) : 'nunca';
  const puedeCompartir = !!(navigator.canShare && window.File && navigator.canShare({files:[new File(['x'],'a.json',{type:'application/json'})]}));
  el.innerHTML=panelCarteras()+`
  <div style="display:flex;flex-direction:column;gap:16px">
  <div class="panel">
    <h2>Precios automáticos</h2>
    <p class="note">La app lee los precios de una hoja de Google tuya que usa la función GOOGLEFINANCE. Las cotizaciones de la Bolsa de Madrid llegan con unos 15 minutos de retraso. La guía de instalación explica cómo crear la hoja.</p>
    <label>Enlace CSV publicado de tu hoja<input id="aUrl" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" value="${esc(ajustes.csvUrl)}"></label>
    <div class="actions"><button class="btn" id="aGuardar">Guardar y probar</button>${ajustes.csvUrl?'<button class="btn ghost" id="aQuitar">Desconectar</button>':''}</div>
    ${errPrecios?`<p class="err-msg">${esc(errPrecios)}</p>`:(ajustes.ultimaAct?`<p class="note">Última actualización: ${new Date(ajustes.ultimaAct).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}</p>`:'')}
  </div>
  <div class="grid2">
    <div class="panel">
      <h2>Copia de seguridad</h2>
      <p class="note">Tus datos solo están en este dispositivo. Guarda una copia en iCloud, Google Drive o tu correo de vez en cuando. Última copia: <b>${ult}</b>.</p>
      <div class="actions">
        ${puedeCompartir?`<button class="btn" id="eShare" ${demo||!store.movs.length?'disabled':''}>Compartir copia…</button>`:''}
        <button class="btn ${puedeCompartir?'ghost':''}" id="eJson" ${demo||!store.movs.length?'disabled':''}>Descargar copia (JSON)</button>
        <button class="btn ghost" id="eCsv" ${demo||!store.movs.length?'disabled':''}>Descargar para Excel (CSV)</button>
      </div>
      <p class="note" id="eMsg"></p>
    </div>
    <div class="panel">
      <h2>Restaurar</h2>
      <p class="note">Carga una copia JSON de esta app o de la versión anterior en Claude. Sustituirá todos los movimientos y precios actuales.</p>
      <label>Archivo de copia (.json)<input type="file" id="iFile" accept=".json,application/json"></label>
      <div id="iConf"></div>
    </div>
  </div>
  <p class="note">Cartera de Inversiones <b>v${APP_VERSION}</b> · versión móvil. Funciona sin conexión; solo necesita internet para actualizar precios.</p>
  </div>`;
  const nombre=ext=>'cartera-inversiones-'+todayStr()+'.'+ext;
  const json=()=>JSON.stringify(Object.assign({app:'cartera-inversiones',exportado:new Date().toISOString()},store),null,1);
  const marcar=()=>{ajustes.ultimaCopia=new Date().toISOString();guardarAjustes();};
  const descargar=(fn,data,type)=>{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);};
  $('eJson').onclick=()=>{descargar(nombre('json'),json(),'application/json');marcar();toast('Copia descargada');render();};
  $('eCsv').onclick=()=>{descargar(nombre('csv'),toCSV(),'text/csv;charset=utf-8');toast('CSV descargado');};
  const es=$('eShare'); if(es) es.onclick=async()=>{try{await navigator.share({files:[new File([json()],nombre('json'),{type:'application/json'})],title:'Copia Cartera de Inversiones'});marcar();render();toast('Copia compartida');}catch(e){if(e&&e.name!=='AbortError')$('eMsg').textContent='No se pudo compartir. Usa "Descargar copia".';}};
  $('aGuardar').onclick=()=>{const u=$('aUrl').value.trim();
    if(!/^https:\/\/docs\.google\.com\/spreadsheets\/.+/.test(u)){errPrecios='El enlace debe empezar por https://docs.google.com/spreadsheets/ y ser el de "Publicar en la web" en formato CSV.';render();return;}
    ajustes.csvUrl=u;guardarAjustes();
    if(demo){toast('Enlace guardado. Pulsa "Empezar con mi cartera" para usarlo.');render();return;}
    actualizarPrecios(false);};
  const aq=$('aQuitar'); if(aq) aq.onclick=()=>{ajustes.csvUrl='';ajustes.ultimaAct='';errPrecios='';guardarAjustes();render();toast('Precios automáticos desconectados');};
  $('iFile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d; try{d=JSON.parse(rd.result);}catch(x){$('iConf').innerHTML='<p class="err-msg">El archivo no es un JSON válido.</p>';return;}
      if(!d||!Array.isArray(d.movs)){$('iConf').innerHTML='<p class="err-msg">El archivo no parece una copia de esta app.</p>';return;}
      const ok=d.movs.filter(m=>m&&/^\d{4}-\d{2}-\d{2}$/.test(m.fecha)&&['compra','venta','dividendo','liberadas','derechos','split'].includes(m.tipo)&&m.valor);
      $('iConf').innerHTML=`<div class="confirm"><span>${ok.length} movimientos válidos${Array.isArray(d.carteras)&&d.carteras.length>1?' en '+d.carteras.length+' carteras':''}. ¿Sustituir los datos actuales?</span><button class="btn danger small" id="iSi">Sustituir</button><button class="btn ghost small" id="iNo">Cancelar</button></div>`;
      $('iSi').onclick=()=>{store=normalizar(d);demo=false;guardar();tab='resumen';render();toast('Copia restaurada');if(ajustes.csvUrl)actualizarPrecios(true);};
      $('iNo').onclick=()=>{$('iConf').innerHTML='';e.target.value='';};
    };
    rd.readAsText(f);
  };
}
